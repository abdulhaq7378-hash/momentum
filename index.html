<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Momentum — Better Me</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap"><style id="appcss">
/* ============================================================
   MOMENTUM — "Better Me" personal dashboard
   Design system + components. Theme-aware (dark default + light).
   ============================================================ */

/* ---- Pro palette: deep green-black ground · emerald primary · cyan/violet/amber data · gold reward ---- */
:root{
  --bg:#0a0d0c;
  --bg-grad:#0d1210;
  --surface:#111614;
  --surface-2:#161d19;
  --surface-3:#1e2621;
  --surface-4:#28322c;
  --border:rgba(228,244,236,.07);
  --border-strong:rgba(228,244,236,.15);
  --text:#eef3f0;
  --text-2:#9aa9a0;
  --muted:#65756c;

  --accent:#2fd39a;
  --accent-2:#5fe7b8;
  --accent-strong:#20b183;
  --accent-ink:#04130d;
  --accent-soft:rgba(47,211,154,.13);

  /* data / category palette — vibrant but harmonious on dark */
  --c-gym:#f2743d;      --c-gym-soft:rgba(242,116,61,.15);
  --c-study:#3b9ff2;    --c-study-soft:rgba(59,159,242,.15);
  --c-personal:#a78bfa; --c-personal-soft:rgba(167,139,250,.15);
  --c-general:#2fd39a;  --c-general-soft:rgba(47,211,154,.15);
  --c-work:#f2b53d;     --c-work-soft:rgba(242,181,61,.15);

  --good:#2fd39a;
  --warn:#f2b53d;
  --bad:#f2603d;
  --info:#3b9ff2;
  --faith:#38c7d4;
  --faith-soft:rgba(56,199,212,.14);
  --gold:#e6bd6a; --gold-soft:rgba(230,189,106,.15);

  --prio-high:#f2603d;
  --prio-med:#f2b53d;
  --prio-low:#65756c;

  --grid:#1c2420;
  --axis:#2a332e;

  --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.42);
  --shadow-lg:0 28px 70px rgba(0,0,0,.55);
  --radius:16px;
  --radius-md:13px;
  --radius-sm:9px;
  --font:'Plus Jakarta Sans','Manrope','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  --font-display:'Plus Jakarta Sans','Manrope','Segoe UI',system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
html[data-theme="light"]{
  --page:#f0ebe4;          /* warm cream page behind the floating app */
  --bg:#f0ebe4;
  --bg-grad:#f6f1ea;
  --surface:#ffffff;
  --surface-2:#f8f4ee;
  --surface-3:#f0eae1;
  --surface-4:#e7ded2;
  --border:rgba(58,40,24,.08);
  --border-strong:rgba(58,40,24,.15);
  --text:#241d16;
  --text-2:#7b6f62;
  --muted:#a99c8c;

  --accent:#e8734a;        /* warm coral — primary actions & highlights */
  --accent-2:#f0916b;
  --accent-strong:#d75f37;
  --accent-ink:#ffffff;
  --accent-soft:rgba(232,115,74,.12);

  --c-gym:#e8734a; --c-study:#4a90d6; --c-personal:#8b6ff0; --c-general:#2fae82; --c-work:#e0a02a;
  --c-gym-soft:rgba(232,115,74,.12); --c-study-soft:rgba(74,144,214,.12); --c-personal-soft:rgba(139,111,240,.12); --c-general-soft:rgba(47,174,130,.12); --c-work-soft:rgba(224,160,42,.14);
  --good:#2fae82; --warn:#dd9a24; --bad:#e0512e;
  --info:#4a90d6; --faith:#0f9aa6; --faith-soft:rgba(15,154,166,.11);
  --gold:#dd9a4a; --gold-soft:rgba(221,154,74,.16);
  --prio-high:#e0512e; --prio-med:#dd9a24; --prio-low:#a99c8c;
  --grid:#efe7dc; --axis:#e5dbcd;
  --shadow-sm:0 1px 2px rgba(58,40,24,.05);
  --shadow:0 1px 3px rgba(58,40,24,.05), 0 10px 26px rgba(58,40,24,.07);
  --shadow-lg:0 30px 70px rgba(58,40,24,.14);
}
:root{ --page:#07100c; }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 620px at 100% -8%, var(--accent-soft), transparent 55%),
    radial-gradient(900px 500px at -5% 0%, var(--gold-soft), transparent 50%),
    var(--bg);
  color:var(--text);
  font-family:var(--font);
  font-size:14.5px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--surface-4);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
.hidden{display:none!important}
.mono{font-variant-numeric:tabular-nums}

/* ---------------- App shell ---------------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:238px;flex:0 0 238px;
  padding:20px 14px;
  border-right:1px solid var(--border);
  background:linear-gradient(180deg,var(--bg-grad),transparent 34%);
  position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:4px;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 14px}
.brand .logo{
  width:40px;height:40px;border-radius:12px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;font-size:21px;
  box-shadow:0 8px 22px var(--accent-soft);
}
.brand h1{font-size:18px;margin:0;letter-spacing:.2px;font-weight:750}
.brand .sub{font-size:11px;color:var(--muted);margin-top:1px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .navlabel{font-size:10px;font-weight:700;letter-spacing:.7px;color:var(--muted);text-transform:uppercase;padding:12px 12px 5px}
.nav button{
  display:flex;align-items:center;gap:11px;
  padding:10px 12px;border-radius:11px;
  color:var(--text-2);font-size:14px;font-weight:550;
  transition:.15s var(--ease);text-align:left;width:100%;
}
.nav button .ico{width:20px;text-align:center;font-size:15.5px}
.nav button:hover{background:var(--surface);color:var(--text)}
.nav button.active{background:var(--accent-soft);color:var(--text);font-weight:650}
.nav button .badge{margin-left:auto;font-size:10.5px;font-weight:700;background:var(--bad);color:#fff;border-radius:8px;padding:1px 6px;min-width:18px;text-align:center}
.side-foot{margin-top:auto;padding-top:12px}

/* level widget */
.level{padding:11px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--border);margin-bottom:10px}
.lv-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.lv-badge{font-size:11px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-radius:7px;padding:2px 8px}
.lv-title{font-size:12.5px;font-weight:650;color:var(--text-2)}
.lv-bar{height:7px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.lv-bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .5s var(--ease)}
.lv-xp{font-size:10.5px;color:var(--muted);margin-top:5px;text-align:right}
.savebadge{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);padding:0 4px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good)}

.main{flex:1;min-width:0;padding:26px 34px 90px;max-width:1240px;margin:0 auto;width:100%}
.view{animation:fade .28s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}

/* ---------------- Headers ---------------- */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head h2{margin:0;font-size:26px;font-weight:780;letter-spacing:-.4px}
.page-head .lede{color:var(--text-2);font-size:13.5px;margin-top:3px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:650;background:var(--surface);border:1px solid var(--border);color:var(--text-2)}
.chip.accent{background:var(--accent-soft);color:var(--text);border-color:transparent}

/* ---------------- Cards + grid ---------------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card.pad-sm{padding:16px}
.card h3{margin:0 0 3px;font-size:15px;font-weight:680}
.card .card-sub{color:var(--muted);font-size:12px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.card-head h3{margin:0}
.card-head .card-sub{margin:0}

/* ---------------- Buttons ---------------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 15px;border-radius:11px;font-size:13.5px;font-weight:620;background:var(--surface-2);border:1px solid var(--border);color:var(--text);transition:.15s var(--ease);white-space:nowrap}
.btn:hover{background:var(--surface-3);border-color:var(--border-strong)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);border-color:transparent;box-shadow:0 6px 18px var(--accent-soft)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn.tiny{padding:4px 9px;font-size:11.5px;border-radius:8px}
.btn.danger{color:var(--bad);border-color:rgba(239,95,86,.35)}
.btn.danger:hover{background:rgba(239,95,86,.1)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--border);font-size:15px;transition:.15s;flex:0 0 auto}
.iconbtn:hover{background:var(--surface-3)}

/* ---------------- Inputs ---------------- */
.inp{padding:10px 13px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);outline:none;transition:.15s;width:100%}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;line-height:1.55;min-height:70px}
select.inp{cursor:pointer}
.numin{width:76px;text-align:center;font-weight:700}
label.fld{display:block;margin-bottom:12px}
label.fld>span{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.segmented{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:4px;gap:3px;flex-wrap:wrap}
.segmented button{padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:620;color:var(--text-2);transition:.14s;display:flex;align-items:center;gap:6px}
.segmented button:hover{color:var(--text)}
.segmented button.active{background:var(--surface-3);color:var(--text)}
.segmented.sm button{padding:5px 10px;font-size:12px}
.switch{position:relative;width:44px;height:25px;flex:0 0 auto;display:inline-block}
.switch input{display:none}
.switch .sl{position:absolute;inset:0;background:var(--surface-3);border-radius:20px;transition:.2s;cursor:pointer}
.switch .sl::before{content:"";position:absolute;width:19px;height:19px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s var(--ease)}
.switch input:checked+.sl{background:var(--accent)}
.switch input:checked+.sl::before{transform:translateX(19px)}

/* ---------------- Stat tiles ---------------- */
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 17px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat .k{font-size:11.5px;color:var(--muted);font-weight:650;display:flex;align-items:center;gap:6px}
.stat .v{font-size:27px;font-weight:820;letter-spacing:-.6px;margin-top:6px;line-height:1}
.stat .v small{font-size:14px;font-weight:640;color:var(--text-2)}
.stat .foot{font-size:11.5px;color:var(--text-2);margin-top:5px}
.stat.soft{box-shadow:none;background:var(--surface-2)}
.stat .flame{filter:drop-shadow(0 0 8px rgba(245,183,61,.55))}

/* meters */
.meter{margin-top:13px}
.meter .mrow{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px;gap:10px}
.meter .mrow .lab{display:flex;align-items:center;gap:8px;font-weight:600}
.meter .mrow .val{color:var(--text-2);font-weight:650;white-space:nowrap}
.meter .track{height:9px;border-radius:6px;background:var(--surface-3);overflow:hidden}
.meter .track>i{display:block;height:100%;border-radius:6px;transition:width .5s var(--ease)}

/* ---------------- Score ring ---------------- */
.ring{position:relative;display:inline-block}
.ring svg{transform:rotate(-90deg);display:block}
.ring .rc-track{stroke:var(--surface-3)}
.ring .rc-fill{stroke-linecap:round;transition:stroke-dashoffset .7s var(--ease)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .pct{font-weight:850;letter-spacing:-1px;line-height:1}
.ring .lab{font-size:11px;color:var(--muted);margin-top:3px}

/* ---------------- Tasks ---------------- */
.addbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.addbar .inp{flex:1;min-width:170px}
.task{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);margin-bottom:7px;transition:.14s;position:relative}
.task:hover{border-color:var(--border-strong)}
.task.done{opacity:.6}
.task.done .tx{text-decoration:line-through;color:var(--text-2)}
.check{width:22px;height:22px;border-radius:7px;flex:0 0 auto;border:2px solid var(--border-strong);display:grid;place-items:center;transition:.16s;background:transparent}
.check:hover{border-color:var(--accent)}
.task.done .check,.hb.done .check{background:var(--accent);border-color:var(--accent)}
.check svg{width:13px;height:13px;stroke:var(--accent-ink);stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;transition:.22s}
.task.done .check svg,.hb.done .check svg{stroke-dashoffset:0}
.task .catdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.task .tx{flex:1;font-size:14px;min-width:0;word-break:break-word;display:flex;flex-direction:column;gap:3px}
.task .tx .meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--surface-3);color:var(--text-2);display:inline-flex;align-items:center;gap:4px;line-height:1.4}
.tag.prio-high{background:rgba(239,95,86,.16);color:var(--bad)}
.tag.prio-med{background:rgba(245,183,61,.16);color:var(--warn)}
.tag.diff{background:var(--surface-3)}
.tag.due{background:var(--surface-3)}
.tag.due.soon{background:rgba(245,183,61,.16);color:var(--warn)}
.tag.due.over{background:rgba(239,95,86,.16);color:var(--bad)}
.task .row-act{display:flex;gap:4px;opacity:0;transition:.14s}
.task:hover .row-act{opacity:1}
.task .row-act button{width:26px;height:26px;border-radius:7px;color:var(--muted);font-size:14px;display:grid;place-items:center}
.task .row-act button:hover{background:var(--surface-3);color:var(--text)}
.task .row-act button.del:hover{color:var(--bad)}

.catgroup{margin-top:16px}
.catgroup-head{display:flex;align-items:center;gap:9px;margin:0 0 8px;font-size:12.5px;font-weight:700;color:var(--text-2)}
.catgroup-head .cnt{margin-left:auto;font-weight:650;color:var(--muted);font-size:11.5px}

.suggests{display:flex;flex-wrap:wrap;gap:7px}
.suggest{padding:5px 11px;border-radius:999px;font-size:12px;font-weight:550;background:var(--surface-2);border:1px dashed var(--border-strong);color:var(--text-2);transition:.14s}
.suggest:hover{border-style:solid;color:var(--text);background:var(--surface-3)}
.suggest::before{content:"+ ";color:var(--muted)}

/* Big 3 */
.big3{display:grid;gap:10px}
.big3-item{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:14px;background:linear-gradient(100deg,var(--accent-soft),transparent);border:1px solid var(--border)}
.big3-item .num{width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;font-weight:800;display:grid;place-items:center;font-size:13px;flex:0 0 auto}
.big3-item.done{opacity:.62}
.big3-item.done .b3tx{text-decoration:line-through}
.big3-item .b3tx{flex:1;font-weight:600}
.big3-empty{padding:11px 14px;border:1px dashed var(--border-strong);border-radius:12px;color:var(--muted);font-size:13px;cursor:pointer;text-align:center}
.big3-empty:hover{color:var(--text);border-color:var(--accent)}

/* empty state */
.empty{text-align:center;padding:32px 20px;color:var(--muted)}
.empty .big{font-size:32px;margin-bottom:8px}
.empty .t{color:var(--text-2);font-weight:640;margin-bottom:4px}

/* deadlines */
.dl{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);margin-bottom:7px}
.dl .lp{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.dl .dtx{flex:1;font-size:13.5px;font-weight:600}
.dl .dwhen{font-size:12px;color:var(--text-2);font-weight:650;white-space:nowrap}

/* nudge / insight banners */
.banner{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:14px;font-size:13.5px;font-weight:550;margin-bottom:14px}
.banner .bi{font-size:20px}
.banner.good{background:var(--c-general-soft);color:var(--text)}
.banner.warn{background:rgba(245,183,61,.13);color:var(--text)}
.banner.info{background:var(--accent-soft);color:var(--text)}
.insight{padding:11px 14px;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 10px 10px 0;margin-bottom:8px;font-size:13px}
.insight b{color:var(--text)}

/* ---------------- Habits ---------------- */
.hb{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:13px;background:var(--surface-2);border:1px solid var(--border);margin-bottom:8px}
.hb .he{font-size:19px;width:26px;text-align:center}
.hb .hinfo{flex:1;min-width:0}
.hb .hname{font-weight:640;font-size:14px}
.hb .hsub{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.hb .hstreak{font-size:12px;font-weight:750;color:var(--warn);white-space:nowrap}
.hb-week{display:flex;gap:4px}
.hb-week i{width:15px;height:15px;border-radius:4px;background:var(--surface-3);font-size:8px;display:grid;place-items:center;color:var(--muted)}
.hb-week i.on{background:var(--c-general);color:#fff}
.hb-count{display:flex;align-items:center;gap:8px}
.hb-count button{width:24px;height:24px;border-radius:7px;background:var(--surface-3);font-weight:800;font-size:15px;display:grid;place-items:center}
.hb-count button:hover{background:var(--surface-4)}
.hb-count .qty{min-width:44px;text-align:center;font-weight:700;font-size:12.5px}

/* heatmaps */
.heat-month{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.heat-dow{text-align:center;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.heat-cell{aspect-ratio:1/1;border-radius:9px;background:var(--surface-2);border:1px solid var(--border);padding:6px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:.14s;position:relative;overflow:hidden}
.heat-cell.empty{background:transparent;border:none;cursor:default}
.heat-cell:not(.empty):hover{transform:translateY(-2px);border-color:var(--border-strong);box-shadow:var(--shadow)}
.heat-cell .hd{font-size:12px;font-weight:700;z-index:2;position:relative}
.heat-cell .hp{font-size:10px;font-weight:700;z-index:2;position:relative;opacity:.92}
.heat-cell .hm{display:flex;gap:2px;z-index:2;position:relative}
.heat-cell .hm i{width:5px;height:5px;border-radius:50%}
.heat-cell.today{outline:2px solid var(--accent);outline-offset:-2px}
.heat-cell.future{opacity:.4}
.heat-legend{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);margin-top:14px;flex-wrap:wrap}
.heat-legend .sw{width:19px;height:12px;border-radius:4px;display:inline-block}

/* year (github style) */
.year-scroll{overflow-x:auto;padding-bottom:6px}
.year-grid{display:flex;gap:3px;min-width:max-content}
.year-col{display:grid;grid-template-rows:repeat(7,1fr);gap:3px}
.year-cell{width:13px;height:13px;border-radius:3px;background:var(--surface-2);cursor:pointer;transition:.1s}
.year-cell:hover{outline:1.5px solid var(--accent-2)}
.year-cell.today{outline:1.5px solid var(--accent)}
.year-months{display:flex;gap:3px;min-width:max-content;margin-bottom:5px;font-size:10px;color:var(--muted);font-weight:600}

/* habit grid (habits x days) */
.hgrid{overflow-x:auto}
.hgrid table{border-collapse:separate;border-spacing:4px;min-width:max-content}
.hgrid th{font-size:10px;color:var(--muted);font-weight:700;padding:0 2px;text-align:center}
.hgrid td.hn{font-size:12.5px;font-weight:600;text-align:left;white-space:nowrap;padding-right:6px}
.hgrid .hc{width:19px;height:19px;border-radius:5px;background:var(--surface-2);border:1px solid var(--border);cursor:pointer;display:inline-block}
.hgrid .hc.on{background:var(--c-general);border-color:transparent}
.hgrid .hc.partial{background:var(--c-general-soft)}
.hgrid .hc.today{outline:1.5px solid var(--accent)}

/* ---------------- charts ---------------- */
.chart-wrap{width:100%;position:relative}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-top:11px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:11px;height:11px;border-radius:4px;display:inline-block}
.legend i.line{height:3px;width:15px;border-radius:2px}
.axislab{fill:var(--muted);font-size:10px}
.gridline{stroke:var(--grid);stroke-width:1}
.baseline{stroke:var(--axis);stroke-width:1}
.hover-col{fill:transparent;cursor:pointer}
.hover-col:hover{fill:var(--accent-soft)}

#tip{position:fixed;z-index:400;pointer-events:none;opacity:0;transition:opacity .12s;background:var(--surface-3);border:1px solid var(--border-strong);border-radius:10px;padding:8px 11px;font-size:12px;box-shadow:var(--shadow);max-width:250px}
#tip .th{font-weight:750;margin-bottom:4px}
#tip .tr{display:flex;justify-content:space-between;gap:14px;color:var(--text-2)}
#tip .tr b{color:var(--text);font-weight:640}

/* ---------------- goals ---------------- */
.goal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.goal-top{display:flex;align-items:flex-start;gap:12px}
.goal-emoji{font-size:26px;width:46px;height:46px;border-radius:13px;background:var(--surface-2);display:grid;place-items:center;flex:0 0 auto}
.goal-title{font-weight:720;font-size:16px}
.goal-area{font-size:11.5px;color:var(--muted);margin-top:2px}
.goal-actions{margin-left:auto;display:flex;gap:4px}
.ms{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;background:var(--surface-2);font-size:13px;margin-bottom:5px}
.ms.done{opacity:.6;text-decoration:line-through}
.ms .check{width:18px;height:18px;border-radius:6px}
.deadline-badge{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:8px;background:var(--surface-2);color:var(--text-2)}
.deadline-badge.soon{background:rgba(245,183,61,.15);color:var(--warn)}
.deadline-badge.over{background:rgba(239,95,86,.15);color:var(--bad)}

/* ---------------- focus ---------------- */
.focus-hero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
@media(max-width:820px){.focus-hero{grid-template-columns:1fr}}
.dur-opts button{min-width:52px;justify-content:center}
.emergency{width:100%;padding:16px;border-radius:16px;font-size:16px;font-weight:800;letter-spacing:.3px;color:#fff;background:linear-gradient(135deg,#ef5f56,#e0662f);border:none;box-shadow:0 10px 26px rgba(239,95,86,.3);transition:.15s}
.emergency:hover{filter:brightness(1.06);transform:translateY(-1px)}

/* focus overlay (fullscreen) */
.focus-overlay{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  background:radial-gradient(1000px 700px at 50% 20%, #241b15, #0a0705 70%);color:#fff;animation:fade .3s var(--ease);text-align:center;padding:24px}
html[data-theme="light"] .focus-overlay{background:radial-gradient(1000px 700px at 50% 20%, #2c211a, #150f0b 75%)}
.focus-overlay .fo-kicker{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:700}
.focus-overlay .fo-label{font-size:23px;font-weight:750;margin-top:4px}
.focus-overlay .fo-ringwrap{position:relative;margin:22px 0 8px}
.focus-overlay .fo-time{font-size:64px;font-weight:850;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.focus-overlay .fo-sub{font-size:13px;color:rgba(255,255,255,.6)}
.focus-overlay .fo-stats{display:flex;gap:26px;margin-top:20px}
.focus-overlay .fo-stats .fs{text-align:center}
.focus-overlay .fo-stats .fsv{font-size:22px;font-weight:800}
.focus-overlay .fo-stats .fsk{font-size:11px;color:rgba(255,255,255,.5);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.focus-overlay .fo-controls{display:flex;gap:12px;margin-top:26px}
.focus-overlay .fo-controls .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:#fff}
.focus-overlay .fo-controls .btn:hover{background:rgba(255,255,255,.16)}
.focus-overlay.distracted{background:radial-gradient(1000px 700px at 50% 20%, #3a1620, #0c0608 70%)}
.fo-warn{position:absolute;top:26px;left:0;right:0;font-size:14px;font-weight:700;color:#ffb4b4;opacity:0;transition:.2s}
.focus-overlay.distracted .fo-warn{opacity:1}
.fo-quote{position:absolute;bottom:30px;left:0;right:0;font-size:13px;color:rgba(255,255,255,.4);font-style:italic;padding:0 24px}
.fo-tasks{margin-top:18px;display:flex;flex-direction:column;gap:6px;max-width:340px;width:100%}
.fo-tasks .fot{display:flex;align-items:center;gap:9px;font-size:13px;color:rgba(255,255,255,.75);background:rgba(255,255,255,.05);padding:7px 11px;border-radius:9px;cursor:pointer}
.fo-tasks .fot.done{opacity:.5;text-decoration:line-through}
/* minimized focus timer — stays visible over the dashboard after leaving fullscreen */
.focus-overlay.mini{inset:auto;right:20px;bottom:20px;width:auto;height:auto;padding:0;background:transparent;display:block;z-index:600;animation:pop .2s var(--ease)}
.focus-overlay.mini .fo-warn,.focus-overlay.mini .fo-quote{display:none}
@media(max-width:820px){.focus-overlay.mini{right:12px;left:12px;bottom:calc(72px + env(safe-area-inset-bottom))}}
.fo-mini{display:flex;align-items:center;gap:14px;background:#151322;color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:12px 14px;box-shadow:0 20px 55px rgba(0,0,0,.5)}
.fo-mini-dot{width:10px;height:10px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 4px rgba(61,220,132,.18);flex:0 0 auto;animation:fopulse 2s infinite}
.fo-mini-dot.away{background:#ff6b6b;box-shadow:0 0 0 4px rgba(255,107,107,.22);animation:none}
.fo-mini-body{min-width:118px;flex:1}
.fo-mini-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:10.5px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.4px}
.fo-mini-label{font-weight:700;color:rgba(255,255,255,.9);text-transform:none;letter-spacing:0;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fo-mini-time{font-size:26px;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1.15;margin-top:1px}
.fo-mini-acts{display:flex;gap:6px;flex:0 0 auto}
.fo-mini-acts .iconbtn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:#fff;width:32px;height:32px}
.fo-mini-acts .iconbtn:hover{background:rgba(255,255,255,.18)}
.fo-mini-acts .iconbtn.danger{color:#ffb4b4}
@keyframes fopulse{0%,100%{opacity:1}50%{opacity:.35}}

/* session list */
.sess{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);margin-bottom:6px;font-size:13px}
.sess .st{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.sess .sinfo{flex:1;min-width:0}
.sess .smeta{font-size:11px;color:var(--muted)}

/* ---------------- academics / gym rows ---------------- */
.subj{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:15px 17px;margin-bottom:11px}
.subj-top{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.subj-name{font-weight:700;font-size:15px}
.topics{display:flex;flex-wrap:wrap;gap:7px}
.topic{font-size:12px;padding:5px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);cursor:pointer;transition:.14s}
.topic.done{background:var(--c-study-soft);border-color:transparent;text-decoration:line-through;color:var(--text-2)}
.topic:hover{border-color:var(--border-strong)}

/* ---------------- modal ---------------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(5px);z-index:450;display:grid;place-items:center;padding:18px;animation:fade .2s}
.modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:20px;max-width:500px;width:100%;padding:24px;box-shadow:var(--shadow-lg);max-height:88vh;overflow:auto;animation:pop .22s var(--ease)}
.modal.wide{max-width:640px}
.modal h3{margin:0 0 3px;font-size:19px}
.modal .msub{color:var(--muted);font-size:13px;margin-bottom:16px}
.modal-foot{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap}
.mtask{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;background:var(--surface-2);margin-bottom:5px;font-size:13.5px}
.mtask .catdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.mtask.done{opacity:.55;text-decoration:line-through}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.form-row{grid-template-columns:1fr}}

/* mood */
.mood-pick{display:flex;gap:8px;flex-wrap:wrap}
.mood-pick button{font-size:24px;width:48px;height:48px;border-radius:13px;background:var(--surface-2);border:1px solid var(--border);transition:.14s}
.mood-pick button:hover{transform:scale(1.08)}
.mood-pick button.active{background:var(--accent-soft);border-color:var(--accent)}
.scale-pick{display:flex;gap:6px}
.scale-pick button{width:38px;height:38px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);font-weight:700}
.scale-pick button.active{background:var(--accent);color:#fff;border-color:transparent}

/* settings */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.set-row:last-child{border-bottom:none}
.set-row .lab{font-weight:620}
.set-row .desc{color:var(--muted);font-size:12px;margin-top:2px;max-width:440px}
.themetog{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:4px;gap:3px}
.themetog button{padding:7px 13px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text-2)}
.themetog button.active{background:var(--surface-3);color:var(--text)}
.taglist{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.taglist .tg{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);font-size:12.5px}
.taglist .tg button{color:var(--muted);font-size:14px;line-height:1}
.taglist .tg button:hover{color:var(--bad)}
.codebox{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px;font-family:Consolas,'Courier New',monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;color:var(--text-2);margin-top:8px}

/* ---------------- faith (calm, no gamification) ---------------- */
.faith{border-color:var(--faith-soft);background:linear-gradient(180deg,var(--faith-soft),transparent 55%)}
.faith-next{font-size:12.5px;color:var(--text-2)}
.faith-next b{color:var(--faith)}
.prayers{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
@media(max-width:640px){.prayers{grid-template-columns:repeat(2,1fr)}}
.prayer{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 8px;border-radius:14px;background:var(--surface-2);border:1px solid var(--border);transition:.15s}
.prayer:hover{border-color:var(--faith)}
.prayer.done{background:var(--faith-soft);border-color:transparent}
.prayer.next{outline:2px solid var(--faith);outline-offset:-2px}
.prayer .pchk{width:26px;height:26px;border-radius:50%;border:2px solid var(--border-strong);display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff}
.prayer.done .pchk{background:var(--faith);border-color:transparent}
.prayer .pname{font-weight:700;font-size:13.5px}
.prayer .ptime{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.faith-foot{display:flex;justify-content:space-between;margin-top:14px;font-size:13px;color:var(--text-2)}
.faith-foot b{color:var(--text);font-weight:750}
.quran{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.qrow{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);transition:.15s;text-align:left;width:100%}
.qrow:hover{border-color:var(--faith)}
.qrow.done{background:var(--faith-soft);border-color:transparent}
.qrow .pchk{width:22px;height:22px;border-radius:7px;border:2px solid var(--border-strong);display:grid;place-items:center;font-weight:800;color:#fff;flex:0 0 auto;font-size:12px}
.qrow.done .pchk{background:var(--faith);border-color:transparent}
.qrow .qinfo{flex:1;min-width:0}
.qrow .qname{font-weight:650;font-size:13.5px}
.qrow .qsub{font-size:11.5px;color:var(--muted);margin-top:2px}
.qrow .qopt{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.qrow .qopt.friday{color:var(--faith)}
.ptimes{display:flex;flex-direction:column}
.ptime-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px}
.ptime-row:last-child{border-bottom:none}
.ptime-row b{font-variant-numeric:tabular-nums}
.ptime-row.muted,.ptime-row.muted b{color:var(--muted);font-weight:600}
.kahf-grid{display:flex;flex-wrap:wrap;gap:8px}
.kahf-fri{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 11px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);font-size:11px;min-width:66px;font-weight:600}
.kahf-fri .pchk{font-size:15px;font-weight:800;color:var(--muted)}
.kahf-fri.done{background:var(--faith-soft);border-color:transparent}
.kahf-fri.done .pchk{color:var(--faith)}
.kahf-fri.future{opacity:.4}
.faith-cell{text-align:center;padding:8px}
.faith-stat{font-size:24px;font-weight:800}
.faith-lab{font-size:12px;color:var(--text-2);margin-top:3px}

/* ---------------- december me + dm targets ---------------- */
.december{background:linear-gradient(120deg,var(--accent-soft),transparent 55%)}
.december-vision{color:var(--text-2);font-size:13.5px;margin:0 0 8px;line-height:1.55}
.dm-card{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.dm-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;font-size:13.5px;font-weight:600}
.dm-top b{font-variant-numeric:tabular-nums;white-space:nowrap}
.dm-ctrl{display:flex;align-items:center;gap:8px}
.dm-ctrl button{width:24px;height:24px;border-radius:7px;background:var(--surface-3);font-weight:800;font-size:15px}
.dm-ctrl button:hover{background:var(--surface-4)}

/* ---------------- toast + confetti ---------------- */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);z-index:600;background:var(--surface-3);border:1px solid var(--border-strong);border-radius:12px;padding:12px 18px;font-weight:640;box-shadow:var(--shadow);opacity:0;transition:.28s var(--ease);display:flex;align-items:center;gap:10px;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:550}

/* ---------------- mobile ---------------- */
.mobilenav{display:none}
@media(max-width:820px){
  .app{flex-direction:column}
  .sidebar{display:none}
  .main{padding:18px 14px 92px;max-width:100%}
  .mobilenav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:120;background:var(--surface);border-top:1px solid var(--border);padding:7px 4px calc(7px + env(safe-area-inset-bottom));overflow-x:auto;gap:2px}
  .mobilenav button{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:9.5px;font-weight:650;padding:4px 11px;border-radius:10px;flex:0 0 auto}
  .mobilenav button .ico{font-size:18px}
  .mobilenav button.active{color:var(--accent)}
  .page-head h2{font-size:22px}
}

/* ============================================================
   PRO REFINEMENTS — SaaS-grade type, depth, iconography and a
   "day-completion" reward that lifts the whole UI toward gold.
   (Loaded after base rules so these win by source order.)
   ============================================================ */
body{ letter-spacing:-.006em; }
.brand h1,.page-head h2,.modal h3,.goal-title,.card-head h3,.card h3,.empty .t{ font-family:var(--font-display); font-weight:700; letter-spacing:-.02em; }
.page-head h2{ font-weight:800; letter-spacing:-.03em; text-wrap:balance; }
.stat .v,.ring .pct,.mono,.dm-top b,.faith-stat,.lv-xp,.hgrid th,.year-cell,.dwhen.mono,.stat .k .val{ font-variant-numeric:tabular-nums; }
.navlabel,.stat .k,.qrow .qopt,.heat-dow{ letter-spacing:.08em; text-transform:uppercase; }

/* quiet, deep ground with a faint emerald aura */
body{ background:
  radial-gradient(1200px 700px at 100% -14%, var(--accent-soft), transparent 55%),
  radial-gradient(1000px 560px at -6% 3%, rgba(59,159,242,.05), transparent 52%),
  var(--bg); }

/* sidebar + brand identity */
.sidebar{ background:linear-gradient(180deg, var(--accent-soft), transparent 26%); border-right-color:var(--border); }
.brand .logo{ background:linear-gradient(140deg,var(--accent-2),var(--accent-strong)); color:var(--accent-ink); box-shadow:0 8px 26px rgba(47,211,154,.24); }
.brand h1{ font-size:19px; letter-spacing:-.02em; }
.nav button{ border-radius:10px; }
.nav button .ico svg{ width:19px; height:19px; display:block; stroke:currentColor; }
.nav button.active{ background:var(--accent-soft); color:var(--text); box-shadow:inset 2px 0 0 var(--accent); font-weight:700; }
.nav button.active .ico{ color:var(--accent); }
.lv-badge{ background:linear-gradient(135deg,var(--accent-2),var(--accent-strong)); color:var(--accent-ink); }
.lv-bar>i{ background:linear-gradient(90deg,var(--accent-strong),var(--accent-2)); }

/* depth: spend elevation by role, not on every block */
.card{ box-shadow:none; border-color:var(--border); transition:border-color .18s var(--ease), transform .18s var(--ease); }
.card:hover{ border-color:var(--border-strong); }
.stat{ box-shadow:none; border-radius:var(--radius-md); background:var(--surface); }
.stat .v{ font-weight:800; letter-spacing:-.03em; }
.stat .k{ font-size:11px; }
.chip{ font-weight:650; }

/* controls */
.btn{ font-weight:650; }
.btn.primary{ background:linear-gradient(135deg,var(--accent-2),var(--accent-strong)); color:var(--accent-ink); box-shadow:0 6px 20px rgba(47,211,154,.2); }
.btn.primary:hover{ filter:brightness(1.05); }
.big3-item{ background:linear-gradient(100deg,var(--accent-soft),transparent 70%); }
.big3-item .num{ background:var(--accent); color:var(--accent-ink); }
.prayer.next{ outline-color:var(--faith); }

/* chart polish */
svg.chart text{ fill:var(--text-2); }
.axislab{ fill:var(--muted); }

/* ============================================================
   THE REWARD — completing your day lifts gold light behind the
   page and warms the edges; a perfect day makes it radiant.
   Driven by <html data-glow="0..3"> set in render().
   ============================================================ */
:root{ --glow:0; }
body::before{ content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(1200px 560px at 50% -20%, var(--gold-soft), transparent 60%),
    radial-gradient(900px 460px at 50% -18%, var(--accent-soft), transparent 58%);
  opacity:var(--glow); transition:opacity 1.3s var(--ease); }
/* Only the in-flow app frame needs lifting above the fixed glow layer (z-index:0).
   Everything else here is position:fixed with its own higher z-index — never force
   them to position:relative or they collapse into normal flow (onboarding + focus
   overlay were dropping to the bottom of the page because of this). */
.app{ position:relative; z-index:1; }

/* ---------------- durable sync via the `db` capability ----------------
   db writes are SILENT (never reload the frame) and SERVER-SIDE (they survive a hard refresh,
   app close, and sync across devices via onSnapshot). This REPLACES the old approach that
   republished the whole artifact just to save — that reloaded the iframe, which (with the
   sandbox wiping localStorage/window.name on reload) is what caused the onboarding loop and
   lost progress. The whole state object lives in ONE db document; last-writer-wins. */
let CAP={downloads:null};                 // kept only for the Export-backup button
let DB=null, DBDOC=null, dbSettled=false;
let syncState='local';
let _dbTimer=null, _dbWriting=false, _dbPending=false;
const DB_PATH='app/state';

async function initSync(){
  try{ if(window.claude && claude.use){
    DB = await claude.use('db');
    try{ CAP.downloads = await claude.use('downloads'); }catch(e){}
  } }catch(e){ DB=null; }
  if(DB){ try{ DBDOC=DB.doc(DB_PATH); }catch(e){ DB=null; DBDOC=null; } }
  if(DBDOC){
    try{
      const snap=await DBDOC.get();
      if(snap && snap.exists){
        // Preserve an unsynced local state on startup, but otherwise converge on
        // the document that the server says is current.
        const adopted=adoptRemote(snap.data(), true);
        syncState='synced';
        if(!adopted && state._savedAt){ _dbPending=true; flushDbSave(); }
      }
      else { syncState='synced'; _dbPending=true; flushDbSave(); }   // first run: seed the store from current state
    }catch(e){ syncState='offline'; }
    // live cross-device updates (and confirmation of our own writes)
    try{ DBDOC.onSnapshot(snap=>{
      if(!snap || !snap.exists) return;
      if(snap.metadata && snap.metadata.hasPendingWrites) return;    // ignore the echo of our own in-flight write
      // Do not clobber an edit that is waiting to be written. Once that edit is
      // settled, the next server snapshot is authoritative for every device.
      if(!_dbPending && !_dbWriting) adoptRemote(snap.data());
    }, ()=>{ syncState='offline'; updateSyncBadge(); }); }catch(e){}
  } else { syncState='local'; }
  dbSettled=true;
  updateSyncBadge();
  render();                                // db has now been checked — onboarding may show only if genuinely new
}

// On initial load, preserve a newer unsynced local cache. After that, accept the
// server's current document so devices cannot diverge because of clock skew.
function adoptRemote(remote, preserveNewerLocal=false){
  try{
    if(!remote || !remote.__mst) return;
    if(preserveNewerLocal && state._savedAt && (remote._savedAt||0) <= state._savedAt) return false;
    state = mergeState(remote);
    const ob=document.getElementById('obOverlay'); if(ob && state.profile.onboarded) ob.remove();
    syncState='synced';
    render();
    return true;
  }catch(e){ return false; }
}

// debounced SILENT write to db — coalesces a burst of taps into one write; never reloads
function scheduleDbSave(){
  syncState = DBDOC ? 'pending' : 'local'; updateSyncBadge();
  if(!DBDOC) return;
  _dbPending=true; clearTimeout(_dbTimer); _dbTimer=setTimeout(flushDbSave, 700);
}
async function flushDbSave(){
  if(!DBDOC || !_dbPending || _dbWriting) return;
  _dbWriting=true; _dbPending=false; syncState='saving'; updateSyncBadge();
  try{ state._ui={view:ui.view, curDay:ui.curDay}; await DBDOC.set(JSON.parse(JSON.stringify(state))); syncState='synced'; }
  catch(e){ const c=String((e&&e.code)||''); syncState=/not_granted|revoked|disabled|removed/i.test(c)?'viewonly':'offline'; if(!/viewonly/.test(syncState)) _dbPending=true; }
  _dbWriting=false; updateSyncBadge();
  if(_dbPending && DBDOC){ clearTimeout(_dbTimer); _dbTimer=setTimeout(flushDbSave, 700); }   // coalesce edits made during the write
}
function flushDbNow(){ if(_dbPending && DBDOC && !_dbWriting){ clearTimeout(_dbTimer); flushDbSave(); } }

/* ---------------- XP / level ---------------- */
function computeXP(){
  let xp=0;
  for(const k in state.days){ const s=dayStats(k); xp += s.completed*10; if(s.planned>0 && s.pct===1) xp+=40; const b3=s.big3.filter(Boolean); if(b3.length===3 && b3.every(x=>x.done)) xp+=40; }
  const keys=Object.keys(state.days);
  keys.forEach(k=>{ if(gymDay(k)) xp+=15; });
  xp += state.focusSessions.reduce((a,s)=>a+Math.round((s.focusedMin||0)* (s.completed?1:0.5)),0);
  // habit completions
  for(const k in state.habitLog){ activeHabits().forEach(h=>{ if(habitDone(h,k)) xp+=5; }); }
  xp += Math.round(studyMinutesRange(fromKey(state.profile.startDate), new Date())/30)*5;
  return xp;
}
function levelInfo(){
  const xp=computeXP();
  const lvl=Math.floor(Math.sqrt(xp/60))+1;
  const cur=60*(lvl-1)*(lvl-1), next=60*lvl*lvl;
  return {xp,lvl,title:LEVEL_TITLES[Math.min(lvl-1,LEVEL_TITLES.length-1)],cur,next,pct:Math.min(1,(xp-cur)/(next-cur||1))};
}

function lineChart(n, valueFn, fmt, opts){ // valueFn(k)->0..1 ; fmt for tooltip

  const pts=data.map((d,i)=>({x:x(i),y:y(Math.min(1,d.v)),d,i}));
  const line=smoothPath(pts);

  const last=pts[pts.length-1];

    hover+=`<rect class="hover-col" x="${p.x-slot/2}" y="${padT}" width="${slot}" height="${plotH}" data-tip="${esc(`<div class='th'>${fmtLong(p.d.k)}</div><div class='tr'><span>${opts.name||'Value'}</span><b>${fmt(p.d.v)}</b></div>`)}"/>`; });

function barsChart(items, opts){ // items:[{label,val,max,tip,strong,sub,color}]

  const max=Math.max(1,...items.map(i=>i.max||i.val)); const slot=plotW/Math.max(1,items.length), bw=Math.min(15,slot*0.42), y=v=>padT+plotH-(v/max)*plotH;
  const cols=[...new Set(items.map(it=>it.strong?'var(--accent-2)':(it.color||'var(--accent)')))];

  let g=''; for(let s=0;s<=2;s++){ const gv=max*s/2, gy=y(gv); g+=`<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="var(--grid)" stroke-width="1" stroke-dasharray="2 6"/><text class="axislab" x="${padL-8}" y="${gy+3}" text-anchor="end">${opts.fmt?opts.fmt(gv):Math.round(gv)}</text>`; }
  let bars='',labels='';
  items.forEach((it,i)=>{ const cx=padL+slot*i+slot/2, x=cx-bw/2, base=padT+plotH, yv=y(it.val); const col=it.strong?'var(--accent-2)':(it.color||'var(--accent)'); const ci=cols.indexOf(col);
    bars+=`<rect x="${x}" y="${padT}" width="${bw}" height="${plotH}" rx="${bw/2}" fill="var(--surface-3)"/>`;
    if(it.val>0){ const h=Math.max(bw, base-yv); bars+=`<rect x="${x}" y="${base-h}" width="${bw}" height="${h}" rx="${bw/2}" fill="url(#b${ci}_${gid})"/>`; }
    if(it.val>0&&opts.showVal!==false) bars+=`<text class="axislab" x="${cx}" y="${Math.min(yv,base-bw)-8}" text-anchor="middle" style="fill:var(--text-2);font-weight:700">${opts.valFmt?opts.valFmt(it.val):it.val}</text>`;
    labels+=`<text class="axislab" x="${cx}" y="${H-(opts.sub?16:8)}" text-anchor="middle">${it.label}</text>`;
    if(it.sub) labels+=`<text class="axislab" x="${cx}" y="${H-4}" text-anchor="middle" style="font-size:9px">${it.sub}</text>`;
    if(it.tip) bars+=`<rect class="hover-col" x="${padL+slot*i}" y="${padT}" width="${slot}" height="${plotH}" rx="5" data-tip="${esc(it.tip)}"/>`; });

function ringSVG(pct, size, label, sub){

// semicircle gauge (like the reference "performance" meters)
function gaugeSVG(pct, big, sub){
  pct=Math.min(1,Math.max(0,pct||0)); const gid=uid();
  const W=220,H=136,sw=16,cx=W/2,cy=120,R=cx-sw/2-6;
  const pt=deg=>{ const a=deg*Math.PI/180; return [(cx+R*Math.cos(a)).toFixed(1),(cy-R*Math.sin(a)).toFixed(1)]; };
  const [lx,ly]=pt(180),[rx,ry]=pt(0),[ex,ey]=pt(180-180*pct);
  return `<div style="position:relative;width:${W}px;max-width:100%;margin:0 auto">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;overflow:visible"><defs><linearGradient id="ga_${gid}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--accent-strong)"/><stop offset="1" stop-color="var(--accent-2)"/></linearGradient></defs>
    <path d="M ${lx} ${ly} A ${R} ${R} 0 0 1 ${rx} ${ry}" fill="none" stroke="var(--surface-3)" stroke-width="${sw}" stroke-linecap="round"/>
    ${pct>0.003?`<path d="M ${lx} ${ly} A ${R} ${R} 0 0 1 ${ex} ${ey}" fill="none" stroke="url(#ga_${gid})" stroke-width="${sw}" stroke-linecap="round"/>`:''}</svg>
    <div style="position:absolute;left:0;right:0;bottom:8px;text-align:center"><div class="mono" style="font-size:30px;font-weight:800;letter-spacing:-.02em">${big}</div><div style="font-size:11.5px;color:var(--muted)">${sub||''}</div></div></div>`;
}
// radial tick meter (like the "86% of goals" reference)
function tickRing(pct, big, sub){
  pct=Math.min(1,Math.max(0,pct||0)); const W=210,cx=W/2,cy=W/2,R=90,n=64,start=130,span=280;
  let ticks=''; for(let i=0;i<n;i++){ const frac=i/(n-1); const deg=start+span*frac; const a=deg*Math.PI/180;
    const x1=cx+R*Math.cos(a),y1=cy+R*Math.sin(a),x2=cx+(R-14)*Math.cos(a),y2=cy+(R-14)*Math.sin(a); const on=frac<=pct;

  return `<div style="position:relative;width:${W}px;max-width:100%;margin:0 auto"><svg viewBox="0 0 ${W} ${W}" style="width:100%">${ticks}</svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 22%"><div class="mono" style="font-size:34px;font-weight:800;letter-spacing:-.02em">${big}</div><div style="font-size:11px;color:var(--muted);margin-top:2px;line-height:1.35">${sub||''}</div></div></div>`;

function practiceBlock(k){
  const cfg=faithCfg(); const list=activePractices(); const pr=(getDay(k).practices)||{};
  const done=list.filter(p=>pr[p.id]).length; const st=practiceStats(effStart(), new Date());
  const rows=list.length ? list.map(p=>`<button class="prayer ${pr[p.id]?'done':''}" data-action="practice" data-id="${attr(p.id)}" data-k="${k}">
     <span class="pchk">${pr[p.id]?'✓':''}</span><span class="pname">${esc(p.name)}</span><span class="ptime">${p.time?esc(p.time):''}</span></button>`).join('')
    : `<div class="empty" style="padding:16px"><div>No practices yet.</div><button class="btn small primary" data-action="addpractice" style="margin-top:8px">${ic('plus')} Add a practice</button></div>`;
  return `<div class="card faith">
    <div class="card-head"><h3>${esc(cfg.title||'Daily Practice')}</h3><span class="faith-next">${isToday(k)?'Today':fmtLong(k)}</span></div>
    <div class="prayers">${rows}</div>
    ${list.length?`<div class="faith-foot"><span><b>${done}/${list.length}</b> completed today</span><span><b>${Math.round(st.pct*100)}%</b> consistency</span></div>`:''}
  </div>`;
}

  const loc=state.settings.location;

    <span class="chip" style="background:var(--faith-soft);color:var(--faith)">Next · ${np.label} ${fmtTime(np.time)}</span></div>

  <div class="grid g2" style="margin-top:16px">
    <div class="card"><div class="card-head"><h3>Today's prayer times</h3><span class="card-sub">${esc(loc.city||'')} · ${(PRAYER_METHODS[loc.method]||{}).name||loc.method}</span></div>
      <div class="ptimes">
        ${[['fajr','Fajr'],['sunrise','Sunrise'],['dhuhr','Dhuhr'],['asr','Asr'],['maghrib','Maghrib'],['isha','Isha']].map(([id,l])=>`<div class="ptime-row ${id==='sunrise'?'muted':''}"><span>${l}</span><b>${fmtTime(t[id])}</b></div>`).join('')}
      </div>
      <button class="btn small" data-action="nav" data-view="settings" style="margin-top:12px">Change location / method</button>
    </div>
    <div class="card"><div class="card-head"><h3>Surah Al-Kahf</h3><span class="card-sub">Every Friday</span></div>
      <div class="kahf-grid">${kahfCells}</div>
      <div class="faith-foot" style="margin-top:12px"><span><b>${kahfMonth.kahfDone}/${kahfMonth.kahfPossible||0}</b> Fridays this month</span><span><b>${kahfStreak()}</b> streak</span></div>
    </div>
  </div>

  <div class="grid g2" style="margin-top:16px">
    <div class="card"><div class="card-head"><h3>Prayer consistency</h3><span class="card-sub">Last 14 days · tap to fill</span></div>
      <div class="hgrid"><table><thead><tr><th></th>${gridHead}</tr></thead><tbody>${gridRows}</tbody></table></div>
    </div>
    <div class="card"><div class="card-head"><h3>Daily Quran</h3><span class="card-sub">Optional</span></div>
      <div class="grid g2" style="gap:11px">
        ${mini(ic('calendar'),'This week', faithStats(startOfWeek(new Date()),new Date()).quran+'/7')}

VIEWS.tasks = function(){
  const k=ui.curDay, s=dayStats(k);
  const rel = k===todayKey()?'Today':(k===keyOf(addDays(new Date(),-1))?'Yesterday':(k===keyOf(addDays(new Date(),1))?'Tomorrow':''));
  const groups = CAT_ORDER.map(c=>{ const ts=s.tasks.filter(t=>t.category===c); if(!ts.length) return ''; const cs=s.byCat[c];
    return `<div class="catgroup"><div class="catgroup-head"><span>${CATS[c].emoji} ${CATS[c].label}</span><span class="cnt">${cs.completed}/${cs.planned}</span></div>${ts.map(taskRow).join('')}</div>`; }).join('');
  return `
  <div class="page-head">
    <div><h2>Tasks</h2><div class="lede">Add fast, or tap ${ic('mic')} Speak your plan. Tap to complete.</div></div>
    <div class="addbar" style="gap:8px">
      <button class="btn small primary" data-action="planday" data-date="${k}">${ic('mic')} Speak your plan</button>
      <button class="iconbtn" data-action="day" data-dir="-1">‹</button>
      <div class="chip">${rel?rel+' · ':''}${fmtShortK(k)}</div>
      <button class="iconbtn" data-action="day" data-dir="1">›</button>
      ${k!==todayKey()?`<button class="btn small" data-action="today-jump">Today</button>`:''}
    </div>
  </div>

  <div class="card">
    <div class="segmented" id="catSeg" style="margin-bottom:11px">${CAT_ORDER.map(c=>`<button data-action="pickcat" data-cat="${c}" class="${ui.addCat===c?'active':''}">${CATS[c].emoji} ${CATS[c].short}</button>`).join('')}</div>
    <div class="addbar">
      <input class="inp" id="taskInput" placeholder="Add a ${CATS[ui.addCat].short.toLowerCase()} task and press Enter…" autocomplete="off">
      <button class="btn" data-action="addtask-detail">${ic('plus')}Details</button>
      <button class="btn primary" data-action="addtask">Add</button>
    </div>
    <div class="suggests" style="margin-top:11px">${(SUGGESTS[ui.addCat]||[]).map(t=>`<button class="suggest" data-action="suggest" data-text="${esc(t)}">${t}</button>`).join('')}</div>
    <div style="display:flex;gap:9px;margin-top:12px;flex-wrap:wrap">
      <button class="btn small" data-action="carryover">${ic('undo')} Carry over unfinished</button>
      <span class="chip" style="margin-left:auto">${s.completed}/${s.planned} done · ${Math.round(s.pct*100)}%</span>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    ${s.planned? groups : `<div class="empty"><div class="big">${ic('star')}</div><div class="t">No tasks for this day</div><div>Add your first one above — keep it quick.</div></div>`}
  </div>

  <div class="card" style="margin-top:16px">
    <div class="card-head"><h3>Daily check-in</h3><span class="card-sub">optional · takes 15 seconds</span></div>
    <label class="fld"><span>Reflection — one win or one lesson</span><textarea class="inp" id="noteArea" placeholder="How did today go?">${esc(getDay(k).note||'')}</textarea></label>
    <div class="form-row">
      <div><div style="font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px">Mood</div>
        <div class="mood-pick">${MOODS.map((e,i)=>`<button data-action="setmood" data-v="${i}" class="${getDay(k).mood===i?'active':''}">${e}</button>`).join('')}</div></div>
      <div><div style="font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px">Energy (1–5)</div>
        <div class="scale-pick">${[1,2,3,4,5].map(n=>`<button data-action="setenergy" data-v="${n}" class="${getDay(k).energy===n?'active':''}">${n}</button>`).join('')}</div></div>
    </div>
    <div class="form-row">
      <label class="fld" style="margin-bottom:0"><span>${ic('moon')} Hours slept</span><input class="inp" type="number" step="0.5" min="0" max="16" id="sleepHrs" value="${esc(getDay(k).sleep&&getDay(k).sleep.hrs?getDay(k).sleep.hrs:'')}" placeholder="e.g. 7.5"></label>
      <label class="fld" style="margin-bottom:0"><span> Stress (1–5)</span><input class="inp" type="number" min="1" max="5" id="stressLvl" value="${esc(getDay(k).stress||'')}" placeholder="1 = calm"></label>
    </div>
  </div>`;
};
function taskRow(t){
  const meta=[];
  if(t.priority&&t.priority!=='low') meta.push(`<span class="tag prio-${t.priority}">${PRIO[t.priority].l}</span>`);
  if(t.difficulty) meta.push(`<span class="tag diff">${DIFF[t.difficulty]}</span>`);
  if(t.startMin!=null) meta.push(`<span class="tag">${ic('clock')} ${fmtClock(t.startMin)}${t.endMin!=null?'–'+fmtClock(t.endMin):''}</span>`);
  if(t.estMin) meta.push(`<span class="tag">${ic('clock')} ${fmtMin(t.estMin)}</span>`);
  if(t.recurring) meta.push(`<span class="tag">${ic('repeat')}</span>`);
  if(t.deadline){ const dd=daysBetween(todayKey(),t.deadline); meta.push(`<span class="tag due ${dd<=1?'over':dd<=4?'soon':''}">${ic('calendar')} ${dlText(t.deadline)}</span>`); }
  const goal=t.goalId&&state.bigGoals.find(g=>g.id===t.goalId); if(goal) meta.push(`<span class="tag">${ic('award')} ${esc(goal.title)}</span>`);
  return `<div class="task ${t.done?'done':''}" data-id="${attr(t.id)}">
    <button class="check" data-action="toggle" data-id="${attr(t.id)}"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6"/></svg></button>
    <span class="catdot" style="background:${CATS[t.category].color}"></span>
    <span class="tx">${esc(t.text)}${meta.length?`<span class="meta">${meta.join('')}</span>`:''}</span>
    <span class="row-act"><button data-action="taskedit" data-id="${attr(t.id)}" title="Edit">✎</button><button class="del" data-action="deltask" data-id="${attr(t.id)}" title="Delete">${ic('trash')}</button></span>
  </div>`;
}
afterRender.tasks = function(){
  const i=el('taskInput'); if(i){ i.focus(); i.addEventListener('keydown',e=>{ if(e.key==='Enter') addTask(); }); }
  const note=el('noteArea'); if(note){ let tm; note.addEventListener('input',()=>{ clearTimeout(tm); tm=setTimeout(()=>{ ensureDay(ui.curDay).note=note.value; save(); },350); }); }
  const sh=el('sleepHrs'); if(sh){ sh.addEventListener('change',()=>{ const d=ensureDay(ui.curDay); d.sleep=d.sleep||{}; d.sleep.hrs=parseFloat(sh.value)||null; save(); }); }
  const st=el('stressLvl'); if(st){ st.addEventListener('change',()=>{ ensureDay(ui.curDay).stress=parseInt(st.value)||null; save(); }); }
};

VIEWS.habits = function(){
  const hs=activeHabits(); const tk=todayKey(); const ws=startOfWeek(new Date());
  const {y,m}=ui.calRef;
  const rows = hs.map(h=>{
    const done=habitDone(h,tk), streak=habitStreak(h), wc=habitWeekCount(h,ws), cons=Math.round(habitMonthConsistency(h,y,m)*100);
    const weekDots = DOW.map((d,i)=>{ const on=habitDone(h,keyOf(addDays(ws,i))); return `<i class="${on?'on':''}">${d[0]}</i>`; }).join('');
    const ctrl = h.type==='count'
      ? `<div class="hb-count"><button data-action="habitminus" data-id="${attr(h.id)}">−</button><span class="qty">${habitVal(h,tk)}/${esc(h.target)} ${esc(h.unit||'')}</span><button data-action="habitplus" data-id="${attr(h.id)}">${ic('plus')}</button></div>`
      : `<button class="check ${done?'done':''}" data-action="habittoggle" data-id="${attr(h.id)}"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6"/></svg></button>`;
    return `<div class="hb ${done?'done':''}">
      <span class="he">${emojiIcon(h.emoji,'check')}</span>
      <div class="hinfo"><div class="hname">${esc(h.name)}</div>
        <div class="hsub"><span>${h.type==='count'?`Target ${esc(h.target)} ${esc(h.unit||'')}/day`:'Daily'}</span><span>·</span><span>${cons}% this month</span></div>
        <div class="hb-week" style="margin-top:6px">${weekDots}</div>
      </div>
      <div style="text-align:right"><div class="hstreak">${ic('flame')} ${streak}</div><div style="font-size:10.5px;color:var(--muted);margin-top:2px">${wc}/${esc(h.perWeek||7)} wk</div></div>
      ${ctrl}
      <button class="iconbtn" data-action="habitedit" data-id="${attr(h.id)}" style="width:30px;height:30px">${ic('edit')}</button>
    </div>`;
  }).join('');

  // habit x day grid (last 21 days)
  const gridDays = lastNKeys(21);
  const gridHead = gridDays.map(k=>`<th>${fromKey(k).getDate()}</th>`).join('');
  const gridRows = hs.map(h=>`<tr><td class="hn">${emojiIcon(h.emoji,'check')} ${esc(h.name)}</td>${gridDays.map(k=>{ const done=habitDone(h,k); return `<td><span class="hc ${done?'on':''} ${isToday(k)?'today':''}" data-action="gridtoggle" data-id="${attr(h.id)}" data-k="${k}"></span></td>`; }).join('')}</tr>`).join('');

  return `
  <div class="page-head"><div><h2>Habits</h2><div class="lede">Consistency beats intensity. Track streaks, not perfection.</div></div>
    <button class="btn primary" data-action="addhabit">${ic('plus')}New habit</button></div>

  ${hs.length? `<div class="card">${rows}</div>
  <div class="card" style="margin-top:16px"><div class="card-head"><h3>Consistency grid</h3><span class="card-sub">Last 21 days · click to fill</span></div>
    <div class="hgrid"><table><thead><tr><th></th>${gridHead}</tr></thead><tbody>${gridRows}</tbody></table></div>
  </div>`
  : `<div class="card"><div class="empty"><div class="big">${ic('leaf')}</div><div class="t">No habits yet</div><div>Add recurring things like Gym, Study, Reading, Water, Sleep.</div><button class="btn primary" data-action="addhabit" style="margin-top:12px">${ic('plus')}Add your first habit</button></div></div>`}`;
};

/* ============================================================
   VIEW: FOCUS
   ============================================================ */
VIEWS.focus = function(){
  const tk=todayKey();
  const todaySess=state.focusSessions.filter(s=>s.date===tk);
  const todayMin=todaySess.reduce((a,s)=>a+(s.focusedMin||0),0);
  const todayInt=todaySess.reduce((a,s)=>a+(s.interruptions||0),0);
  const all=state.focusSessions;
  const completed=all.filter(s=>s.completed).length, abandoned=all.length-completed;
  const compPct=all.length?Math.round(completed/all.length*100):0;
  const longest=all.reduce((a,s)=>Math.max(a,s.focusedMin||0),0);
  const totalMin=all.reduce((a,s)=>a+(s.focusedMin||0),0);
  const fStreak=longestStreakOf(k=>focusMinutesOn(k)>0);
  const curFocusStreak=(()=>{ let d=new Date();d.setHours(0,0,0,0); if(focusMinutesOn(keyOf(d))===0)d=addDays(d,-1); let s=0; while(focusMinutesOn(keyOf(d))>0){s++;d=addDays(d,-1);} return s; })();
  const incompleteTasks=(getDay(tk).tasks||[]).filter(t=>!t.done && t.category==='academics');

  const types=[['study','Study'],['assignment','Assignment'],['work','Work'],['gym','Workout'],['other','Other']];
  const durs=[25,45,60,90,120];

  return `
  <div class="page-head"><div><h2>Focus Mode</h2><div class="lede">Distraction-free deep work. Leaving the screen counts as an interruption.</div></div>
    <span class="chip accent">${ic('flame')} ${curFocusStreak}-day focus streak</span></div>

  <div class="focus-hero">
    <div class="card">
      <h3>Start a session</h3>
      <label class="fld"><span>What are you focusing on?</span>
        <div class="segmented" id="fType">${types.map(([v,l])=>`<button data-action="fseltype" data-v="${v}" class="${ui.fsel.type===v?'active':''}">${l}</button>`).join('')}</div>
      </label>
      <label class="fld"><span>Session label (optional)</span><input class="inp" id="fLabel" placeholder="e.g. Signals & Systems — Ch 4" autocomplete="off"></label>
      ${incompleteTasks.length?`<label class="fld"><span>Link a task (optional)</span><select class="inp" id="fTask"><option value="">— none —</option>${incompleteTasks.map(t=>`<option value="${attr(t.id)}">${esc(t.text)}</option>`).join('')}</select></label>`:''}
      <label class="fld"><span>Duration</span>
        <div class="segmented dur-opts" id="fDur">${durs.map(d=>`<button data-action="fseldur" data-min="${d}" class="${ui.fsel.min===d?'active':''}">${d}m</button>`).join('')}</div>
      </label>
      <label class="fld"><span>Ambient sound</span>
        <select class="inp" id="fAmbient">${['none','brown','pink','white','rain'].map(a=>`<option value="${a}" ${ui.fsel.ambient===a?'selected':''}>${a==='none'?'None':a[0].toUpperCase()+a.slice(1)+' noise'}</option>`).join('')}</select>
      </label>
      <div style="display:flex;gap:10px;margin-top:6px">
        <button class="btn primary block" data-action="fstart">${ic('play')} Start Focus (${ui.fsel.min}m)</button>
      </div>
      <button class="emergency" data-action="emergency" style="margin-top:10px">${ic('alert')} I NEED TO FOCUS — quick ${state.settings.focus.defaultMin}m</button>
    </div>

    <div class="card">
      <h3>Today</h3>
      <div style="margin:14px 0 6px">${gaugeSVG(Math.min(1, todayMin/(state.settings.focus.focusTarget||90)), fmtMin(todayMin), 'of '+fmtMin(state.settings.focus.focusTarget||90)+' goal')}</div>
      <div class="grid g2" style="gap:11px">
        ${mini('','Sessions', todaySess.length)}
        ${mini('','Interruptions', todayInt)}
      </div>
      <div class="desc" style="margin-top:14px">Leaving this screen mid-session counts as an interruption — it's here to keep you honest, not to lock anything.</div>
    </div>
  </div>

  <div class="grid g4" style="margin-top:16px">
    <div class="stat"><div class="k">Total focus</div><div class="v">${fmtMin(totalMin)}</div><div class="foot">${all.length} sessions</div></div>
    <div class="stat"><div class="k">Completion</div><div class="v">${compPct}<small>%</small></div><div class="foot">${completed} done · ${abandoned} quit</div></div>
    <div class="stat"><div class="k">Longest</div><div class="v">${fmtMin(longest)}</div><div class="foot">single session</div></div>

function goalProgress(g){
  if(g.milestones && g.milestones.length){ return g.milestones.filter(m=>m.done).length/g.milestones.length; }
  // auto by area metric if no milestones
  const from=fromKey(state.profile.startDate), to=new Date();
  if(g.metric==='gym') return Math.min(1, rangeStats(from,to).gym/(g.target||1));
  if(g.metric==='study_hrs') return Math.min(1, studyMinutesRange(from,to)/60/(g.target||1));
  if(g.metric==='focus_hrs') return Math.min(1, focusMinutesRange(from,to)/60/(g.target||1));
  if(g.metric==='tasks') return Math.min(1, rangeStats(from,to).completed/(g.target||1));
  return 0;
}

function woRow(w){

function bwChart(bw){
  const min=Math.min(...bw.map(b=>b.kg))-1, max=Math.max(...bw.map(b=>b.kg))+1;
  const W=680,H=180,padL=34,padB=22,padT=12,padR=10,plotW=W-padL-padR,plotH=H-padT-padB;
  const x=i=>padL+plotW*(bw.length===1?0:i/(bw.length-1)), y=v=>padT+plotH-((v-min)/(max-min||1))*plotH;
  let g=''; [0,.5,1].forEach(gg=>{ const val=min+(max-min)*gg, gy=y(val); g+=`<line class="gridline" x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}"/><text class="axislab" x="${padL-6}" y="${gy+3}" text-anchor="end">${val.toFixed(0)}</text>`; });
  const pts=bw.map((b,i)=>({x:x(i),y:y(b.kg),b}));
  const line='M '+pts.map(p=>`${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' L ');
  let dots=''; pts.forEach((p,i)=>{ dots+=`<circle cx="${p.x}" cy="${p.y}" r="3" fill="var(--c-gym)" stroke="var(--surface)" stroke-width="2" data-tip="${esc(`<div class='th'>${fmtShortK(p.b.date)}</div><div class='tr'><span>Weight</span><b>${p.b.kg} kg</b></div>`)}"/>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}<path d="${line}" fill="none" stroke="var(--c-gym)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>${dots}<line class="baseline" x1="${padL}" y1="${padT+plotH}" x2="${W-padR}" y2="${padT+plotH}"/></svg>`;
}

    ${mode==='week'?reviewWeek():mode==='month'?reviewMonth():mode==='reset'?reviewReset():reviewRecords()}`;

function insightsFor(a,b, prev){
  const out=[]; const r=rangeStats(a,b);
  // completion vs prev
  if(prev){ const rp=rangeStats(prev.a, prev.b); if(rp.planned>0 && r.planned>0){ const diff=Math.round((r.pct-rp.pct)*100); if(Math.abs(diff)>=3) out.push(`Task completion ${diff>0?'improved':'dropped'} <b>${Math.abs(diff)}%</b> vs the previous period.`); }
    if(r.studyMin-rp.studyMin!==0 && (r.studyMin>0||rp.studyMin>0)) out.push(`Study time ${r.studyMin>=rp.studyMin?'up':'down'} <b>${fmtMin(Math.abs(r.studyMin-rp.studyMin))}</b> vs before.`); }
  // best time of day for completed academic tasks
  const hours=[]; for(let d=new Date(a); d<=b; d=addDays(d,1)){ (getDay(keyOf(d)).tasks||[]).forEach(t=>{ if(t.done && t.doneAt && t.category==='academics'){ hours.push(new Date(t.doneAt).getHours()); } }); }
  if(hours.length>=3){ const avg=Math.round(hours.reduce((x,y)=>x+y,0)/hours.length); out.push(`You complete most study tasks around <b>${avg}:00</b>. Protect that window.`); }
  // miss reasons
  const reasons={}; let missed=0; for(let d=new Date(a); d<=b; d=addDays(d,1)){ (getDay(keyOf(d)).tasks||[]).forEach(t=>{ if(!t.done && t.missReason){ reasons[t.missReason]=(reasons[t.missReason]||0)+1; missed++; } }); }
  const topR=Object.entries(reasons).sort((x,y)=>y[1]-x[1])[0];
  if(topR) out.push(`Missed tasks this period were mostly due to <b>${topR[0]}</b> (${topR[1]}×).`);
  // difficulty
  const diff={easy:[0,0],med:[0,0],hard:[0,0]}; for(let d=new Date(a); d<=b; d=addDays(d,1)){ (getDay(keyOf(d)).tasks||[]).forEach(t=>{ if(t.difficulty&&diff[t.difficulty]){ diff[t.difficulty][1]++; if(t.done)diff[t.difficulty][0]++; } }); }
  if(diff.hard[1]>=3){ const hp=Math.round(diff.hard[0]/diff.hard[1]*100); if(hp<60) out.push(`Only <b>${hp}%</b> of hard tasks got done — you may be avoiding difficult work. Try scheduling one first thing.`); }
  if(!out.length) out.push('Keep logging — after a few days I can spot patterns in your data.');
  return out;
}

  <div class="card" style="margin-top:16px"><div class="card-head"><h3>Insights</h3><span class="card-sub">from your data</span></div>${ins.map(i=>`<div class="insight">${i}</div>`).join('')}</div>
  ${faithSection(ws,we)}`;

function wkTile(e,l,v){ return `<div class="stat"><div class="k">${e} ${l}</div><div class="v">${v}</div></div>`; }
function reviewMonth(){

function cmpTile(e,l,v,d,unit){ const good=d>0; const col=d===0?'var(--muted)':good?'var(--good)':'var(--bad)'; const dt=d===0?'—':(d>0?'+':'')+(unit==='min'?(d<0?'-':'')+fmtMin(Math.abs(d)):d)+(unit==='%'?'%':''); return `<div class="stat"><div class="k">${e} ${l}</div><div class="v" style="font-size:22px">${v}</div><div class="foot" style="color:${col};font-weight:700">${dt} vs last</div></div>`; }
function reviewRecords(){
  const recs=computeRecords();
  return `<div class="card"><div class="card-head"><h3>Personal records</h3><span class="card-sub">Things to beat</span></div>
    <div class="grid g3">
    ${recTile(ic('flame'),'Longest streak', recs.longestStreak+' days')}
    ${recTile(ic('dumbbell'),'Longest gym streak', recs.gymStreak+' days')}
    ${recTile(ic('book'),'Longest study streak', recs.studyStreak+' days')}
    ${recTile(ic('target'),'Longest focus session', fmtMin(recs.longestFocus))}
    ${recTile(ic('bolt'),'Highest daily score', recs.bestScore+'/100')}
    ${recTile(ic('check'),'Most tasks in a day', recs.mostTasks)}
    ${recTile(ic('bookOpen'),'Most study in a week', fmtMin(recs.mostStudyWeek))}
    ${recTile(ic('star'),'Most productive day', recs.bestDay?fmtShortK(recs.bestDay):'—')}
    ${recTile(ic('dumbbell'),'Total workouts', state.workouts.length)}
    </div></div>`;
}
function recTile(e,l,v){ return `<div class="stat"><div class="k">${e} ${l}</div><div class="v" style="font-size:24px">${v}</div></div>`; }
function computeRecords(){
  let bestScore=0,bestDay=null,mostTasks=0,longestFocus=0;
  for(const k in state.days){ const sc=dayScore(k); if(sc>bestScore){bestScore=sc;bestDay=k;} const s=dayStats(k); if(s.completed>mostTasks)mostTasks=s.completed; }
  state.focusSessions.forEach(s=>{ if((s.focusedMin||0)>longestFocus)longestFocus=s.focusedMin; });
  // most study in a week: scan weeks
  let mostStudyWeek=0; const start=fromKey(state.profile.startDate); let w=startOfWeek(start); const today=new Date();
  while(w<=today){ const m=studyMinutesRange(w, addDays(w,6)); if(m>mostStudyWeek)mostStudyWeek=m; w=addDays(w,7); }
  return {longestStreak:longestStreak(), gymStreak:longestStreakOf(gymDay), studyStreak:longestStreakOf(studyDayFlag), longestFocus, bestScore, bestDay, mostTasks, mostStudyWeek};
}

VIEWS.calendar = function(){
  return `<div class="page-head"><div><h2>Calendar</h2><div class="lede">Every square is a day. = exam, = assignment due.</div></div>

function examsAssignmentsCard(){

  </div>`;
}
function calMonth(){
  const {y,m}=ui.calRef; const first=new Date(y,m,1); const off=(first.getDay()+6)%7; const days=new Date(y,m+1,0).getDate();
  const ms=rangeStats(new Date(y,m,1), (new Date(y,m+1,0))>new Date()?new Date():new Date(y,m+1,0));
  let cells=DOW.map(d=>`<div class="heat-dow">${d}</div>`).join('');
  for(let i=0;i<off;i++) cells+=`<div class="heat-cell empty"></div>`;
  for(let d=1; d<=days; d++){ const k=keyOf(new Date(y,m,d)); const s=dayStats(k); const sc=dayScore(k); const fut=isFuture(k);
    const marks=CAT_ORDER.filter(c=>s.byCat[c].completed>0).map(c=>`<i style="background:${CATS[c].color}"></i>`).join('');
    const dls=deadlinesOn(k); const dlBadge=dls.length?`<div style="position:absolute;top:3px;right:4px;font-size:9px;line-height:1">${dls.some(a=>a.atype==='exam')?ic('fileText'):ic('fileText')}</div>`:'';
    const dlTip=dls.length?`<div class='tr'><span>Due</span><b>${dls.map(a=>esc(a.title)).join(', ')}</b></div>`:'';
    const bg = s.planned>0||focusMinutesOn(k)>0 ? `background:${heatColor(sc/100)};border-color:transparent` : '';
    const ink = sc>=55?'color:#fff':'';
    cells+=`<div class="heat-cell ${isToday(k)?'today':''} ${fut?'future':''}" data-action="daymodal" data-key="${k}" style="${bg}" data-tip="${esc((s.planned?`<div class='th'>${fmtLong(k)}</div><div class='tr'><span>Score</span><b>${sc}</b></div><div class='tr'><span>Tasks</span><b>${s.completed}/${s.planned}</b></div>`:`<div class='th'>${fmtLong(k)}</div>`)+dlTip)}">
      ${dlBadge}<div class="hd" style="${ink}">${d}</div><div class="hm">${marks}</div><div class="hp" style="${ink}">${s.planned||focusMinutesOn(k)?sc:''}</div></div>`; }
  return `<div class="card"><div class="cal-head" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px"><button class="iconbtn" data-action="calmove" data-dir="-1">‹</button><div style="font-size:17px;font-weight:750">${MON[m]} ${y}</div><button class="iconbtn" data-action="calmove" data-dir="1">›</button></div>
    <div class="heat-month">${cells}</div>
    <div class="heat-legend"><span>Less</span><span class="sw" style="background:var(--surface-2)"></span><span class="sw" style="background:${heatColor(.25)}"></span><span class="sw" style="background:${heatColor(.5)}"></span><span class="sw" style="background:${heatColor(.75)}"></span><span class="sw" style="background:${heatColor(1)}"></span><span>More</span><span style="margin-left:auto">Dots = areas completed</span></div>
  </div>
  <div class="grid g4" style="margin-top:16px">${mini(ic('check'),'Tasks done',ms.completed)}${mini(ic('dumbbell'),'Gym days',ms.gym)}${mini(ic('book'),'Study days',ms.study)}${mini(ic('star'),'Perfect days',ms.perfect)}</div>`;
}
function calYear(){
  const start=fromKey(state.profile.startDate); const year=start.getFullYear();
  let w=startOfWeek(start); const end=new Date(year,11,31);
  const weeks=[]; while(w<=end){ weeks.push(new Date(w)); w=addDays(w,7); }
  let cols=''; let monthLabels=''; let lastMonth=-1;
  weeks.forEach(wk=>{ let cells='';
    for(let i=0;i<7;i++){ const d=addDays(wk,i); const k=keyOf(d); const s=dayStats(k); const sc=dayScore(k);
      const has=s.planned>0||focusMinutesOn(k)>0; const style=has?`background:${heatColor(sc/100)}`:'';
      const dim=(d<start||isFuture(k))?'opacity:.25':'';
      cells+=`<div class="year-cell ${isToday(k)?'today':''}" style="${style};${dim}" data-action="daymodal" data-key="${k}" data-tip="${esc(has?`<div class='th'>${fmtLong(k)}</div><div class='tr'><span>Score</span><b>${sc}</b></div>`:`<div class='th'>${fmtLong(k)}</div>`)}"></div>`; }
    const mo=wk.getMonth(); monthLabels+=`<span style="width:16px">${mo!==lastMonth?MONS[mo]:''}</span>`; lastMonth=mo;
    cols+=`<div class="year-col">${cells}</div>`; });
  const r=rangeStats(start, new Date()>end?end:new Date());
  return `<div class="card"><div class="card-head"><h3>Your journey · ${year}</h3><span class="card-sub">Sep → Dec</span></div>
    <div class="year-scroll"><div class="year-months">${monthLabels}</div><div class="year-grid">${cols}</div></div>
    <div class="heat-legend"><span>Less</span><span class="sw" style="background:var(--surface-2)"></span><span class="sw" style="background:${heatColor(.35)}"></span><span class="sw" style="background:${heatColor(.7)}"></span><span class="sw" style="background:${heatColor(1)}"></span><span>More</span></div></div>
  <div class="grid g4" style="margin-top:16px">${mini(ic('check'),'Tasks',r.completed)}${mini(ic('dumbbell'),'Gym days',r.gym)}${mini(ic('target'),'Focus',fmtMin(r.focusMin))}${mini(ic('bolt'),'Avg score',r.avgScore)}</div>`;
}
