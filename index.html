/* ============================================================
   ACTIONS — tasks
   ============================================================ */
function addTask(){ const i=el('taskInput'); if(!i) return; const text=i.value.trim(); if(!text) return; ensureDay(ui.curDay).tasks.push({id:genId(),text,category:ui.addCat,done:false,ts:Date.now()}); save(); i.value=''; render(); }
function addTaskText(text){ ensureDay(ui.curDay).tasks.push({id:genId(),text,category:ui.addCat,done:false,ts:Date.now()}); save(); render(); }
function toggleTask(id){ const day=ensureDay(ui.curDay); const t=day.tasks.find(x=>x.id===id); if(!t) return; const before=dayStats(ui.curDay).pct; const wasDone=t.done; t.done=!t.done; t.doneAt=t.done?Date.now():null;
  // Recurring tasks are separate daily instances, so completing one never
  // mutates its history or lets an undone toggle create duplicate copies.
  if(!wasDone && t.done && t.recurring){
    const next=ensureDay(keyOf(addDays(fromKey(ui.curDay),1)));
    next.tasks.push({...t,id:genId(),done:false,doneAt:null,ts:Date.now(),missReason:null});
  }
  if(!t.done){ /* keep */ } save();
  const after=dayStats(ui.curDay);
  if(t.done && after.pct===1 && after.planned>=1 && before<1){ celebrate(); toast('Perfect day! All tasks complete!'); }
  else if(!t.done){ /* if marking undone, optionally ask reason later */ }
  render();
}
function delTask(id){ const day=ensureDay(ui.curDay); day.tasks=day.tasks.filter(x=>x.id!==id); save(); render(); }
function carryOver(){ const prev=keyOf(addDays(fromKey(ui.curDay),-1)); const pd=getDay(prev); const un=(pd.tasks||[]).filter(t=>!t.done); if(!un.length){ toast('Nothing to carry over'); return; } const day=ensureDay(ui.curDay); un.forEach(t=>day.tasks.push({...t,id:genId(),done:false,doneAt:null,ts:Date.now()})); save(); render(); toast(`Carried over ${un.length} task(s)`); }

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-action]'); if(!t) return; const a=t.dataset.action;
  switch(a){
    case 'nav': go(t.dataset.view); break;
    case 'day': ui.curDay=keyOf(addDays(fromKey(ui.curDay), +t.dataset.dir)); render(); break;
    case 'today-jump': ui.curDay=todayKey(); render(); break;
    case 'pickcat': ui.addCat=t.dataset.cat; render(); break;
    case 'addtask': addTask(); break;
    case 'suggest': addTaskText(t.dataset.text); break;
    case 'toggle': toggleTask(t.dataset.id); break;
    case 'deltask': delTask(t.dataset.id); break;
    case 'carryover': carryOver(); break;
    case 'setmood': { const d=ensureDay(ui.curDay); d.mood=(d.mood===+t.dataset.v)?null:+t.dataset.v; save(); render(); break; }
    case 'setenergy': { const d=ensureDay(ui.curDay); d.energy=(d.energy===+t.dataset.v)?null:+t.dataset.v; save(); render(); break; }
    // faith
    case 'prayer': { const d=ensureDay(t.dataset.k); d.prayers=d.prayers||{}; d.prayers[t.dataset.id]=!d.prayers[t.dataset.id]; save(); render(); break; }
    case 'dailyquran': { const d=ensureDay(t.dataset.k); d.dailyQuran=d.dailyQuran||{}; d.dailyQuran.done=!d.dailyQuran.done; save(); render(); break; }
    case 'alkahf': { const d=ensureDay(t.dataset.k); d.alKahf=!d.alKahf; save(); render(); break; }
    case 'quranlog': openQuranLog(); break;
    case 'practice': { const d=ensureDay(t.dataset.k); d.practices=d.practices||{}; d.practices[t.dataset.id]=!d.practices[t.dataset.id]; save(); render(); break; }
    case 'addpractice': openPracticeModal(null); break;
    case 'editpractice': openPracticeModal(t.dataset.id); break;
    // time + money
    case 'logtime': openTimeLog(); break;
    case 'addexpense': openExpenseModal(); break;
    case 'addincome': openIncomeModal(); break;
    case 'setbudget': openBudgetModal(); break;
    case 'deltx': { if(t.dataset.kind==='in') state.income=state.income.filter(x=>x.id!==t.dataset.id); else state.expenses=state.expenses.filter(x=>x.id!==t.dataset.id); save(); render(); break; }
    // december me
    case 'editdecember': openVisionModal(); break;
    case 'adddmtarget': openDmTargetModal(); break;
    case 'dminc': { const it=state.decemberMe.targets.find(x=>x.id===t.dataset.id); if(it){ it.value=(it.value||0)+1; save(); render(); } break; }
    case 'dmdec': { const it=state.decemberMe.targets.find(x=>x.id===t.dataset.id); if(it){ it.value=Math.max(0,(it.value||0)-1); save(); render(); } break; }
    // weekly reset
    case 'movetask': moveTaskToToday(t.dataset.k, t.dataset.id); break;
    case 'moveall': moveAllUnfinished(); break;
    case 'savetargets2': { state.settings.targets.gymPerWeek=parseInt(el('rs_gym').value)||4; state.settings.targets.studyHrsPerDay=parseFloat(el('rs_study').value)||2; save(); render(); toast('Targets saved'); break; }
    // faith settings
    case 'setreligion': { const rel=el('setReligion').value||'islam'; const prev=religion(); state.profile.religion=rel;
      if(rel!=='islam' && rel!=='none'){ if(!activePractices().length){ seedFaithPractices(rel); }
        else if(prev!==rel && (FAITH_CONFIG[rel]||{}).practices && confirm('Load the default practices for this faith? This replaces your current practice list.')){ seedFaithPractices(rel, true); } }
      save(); applyFaithNav(); go(rel==='none'?'dashboard':'faith'); toast('Faith updated'); break; }
    case 'detectloc': detectLocation(); break;
    case 'saveloc': saveLocationFromForm(); render(); toast('Location saved'); break;
    case 'asr': state.settings.location.asr=t.dataset.v; saveLocationFromForm(); render(); break;
    case 'addtask-detail': openTaskModal(null); break;
    case 'taskedit': openTaskModal(t.dataset.id); break;
    case 'editbig3': openBig3Modal(); break;
    case 'big3toggle': { const d=ensureDay(todayKey()); const b=d.big3[+t.dataset.i]; if(b){ b.done=!b.done; save(); render(); if(d.big3.filter(Boolean).length===3 && d.big3.every(x=>x.done)){ celebrate(); toast('Big 3 complete! Huge.'); } } break; }
    // habits
    case 'addhabit': openHabitModal(null); break;
    case 'habitedit': openHabitModal(t.dataset.id); break;
    case 'habittoggle': { const h=state.habits.find(x=>x.id===t.dataset.id); toggleHabit(h, todayKey()); break; }
    case 'habitplus': { const h=state.habits.find(x=>x.id===t.dataset.id); setHabit(h, todayKey(), habitVal(h,todayKey())+1); break; }
    case 'habitminus': { const h=state.habits.find(x=>x.id===t.dataset.id); setHabit(h, todayKey(), Math.max(0,habitVal(h,todayKey())-1)); break; }
    case 'gridtoggle': { const h=state.habits.find(x=>x.id===t.dataset.id); toggleHabit(h, t.dataset.k); break; }
    // focus
    case 'fseltype': ui.fsel.type=t.dataset.v; render(); break;
    case 'fseldur': ui.fsel.min=+t.dataset.min; render(); break;
    case 'fstart': startFocusFromUI(); break;
    case 'emergency': emergencyFocus(); break;
    case 'fpause': pauseFocus(); break;
    case 'fresume': resumeFocus(); break;
    case 'fmin': minimizeFocus(true); break;
    case 'fexpand': expandFocus(); break;
    case 'fend': tryEndFocus(); break;
    case 'foclose': closeFocusOverlay(); render(); break;
    case 'fbreak': startBreak(); break;
    case 'fotask': { const id=t.dataset.id; toggleFocusTask(id); break; }
    // plan (voice / text brain-dump)
    case 'planday': openPlanModal(t.dataset.date||todayKey()); break;
    // goals
    case 'addgoal': openGoalModal(null); break;
    case 'goaledit': openGoalModal(t.dataset.id); break;
    case 'addms': openMsModal(t.dataset.id); break;
    case 'mstoggle': { const g=state.bigGoals.find(x=>x.id===t.dataset.id); if(g){ g.milestones[+t.dataset.i].done=!g.milestones[+t.dataset.i].done; save(); render(); } break; }
    // gym
    case 'addworkout': openWorkoutModal(); break;
    case 'delworkout': state.workouts=state.workouts.filter(w=>w.id!==t.dataset.id); save(); render(); break;
    // academics
    case 'addsubject': openSubjectModal(); break;
    case 'delsubject': if(confirm('Delete this subject?')){ state.subjects=state.subjects.filter(s=>s.id!==t.dataset.id); save(); render(); } break;
    case 'addtopic': { const s=state.subjects.find(x=>x.id===t.dataset.id); const n=prompt('Topic name:'); if(n){ s.topics=s.topics||[]; s.topics.push({id:genId(),name:n.trim(),done:false}); save(); render(); } break; }
    case 'topictoggle': { const s=state.subjects.find(x=>x.id===t.dataset.id); const tp=s.topics[+t.dataset.i]; tp.done=!tp.done; save(); render(); break; }
    case 'addassign': openAssignModal(); break;
    case 'assigndone': { const as=state.assignments.find(x=>x.id===t.dataset.id); as.done=true; save(); render(); toast('Marked done'); break; }
    case 'logstudy': openLogStudyModal(); break;
    // review / calendar
    case 'revmode': ui.reviewMode=t.dataset.m; render(); break;
    case 'week': ui.weekStart=keyOf(addDays(fromKey(ui.weekStart.slice(0,10)), 7*(+t.dataset.dir))); render(); break;
    case 'week-now': ui.weekStart=keyOf(startOfWeek(new Date())); render(); break;
    case 'month': { ui.monthRef.m+=(+t.dataset.dir); if(ui.monthRef.m<0){ui.monthRef.m=11;ui.monthRef.y--;} if(ui.monthRef.m>11){ui.monthRef.m=0;ui.monthRef.y++;} render(); break; }
    case 'calmode': ui.calMode=t.dataset.m; render(); break;
    case 'calmove': { ui.calRef.m+=(+t.dataset.dir); if(ui.calRef.m<0){ui.calRef.m=11;ui.calRef.y--;} if(ui.calRef.m>11){ui.calRef.m=0;ui.calRef.y++;} render(); break; }
    case 'daymodal': openDayModal(t.dataset.key); break;
    case 'editday': ui.curDay=t.dataset.key; closeModal(); go('tasks'); break;
    case 'scoreinfo': openScoreModal(); break;
    // settings
    case 'savetargets': saveTargets(); break;
    case 'saveweights': saveWeights(); break;
    case 'theme': state.settings.theme=t.dataset.t; state.settings._themeUserSet=true; save(); render(); break;
    case 'syncnow': syncNow(); break;
    case 'export': exportData(); break;
    case 'import': el('importFile').click(); break;
    case 'reset': if(confirm('Erase ALL data and start fresh? This cannot be undone.')){ state=structuredClone(DEFAULT_STATE); save(); render(); } break;
    // modal generic
    case 'closemodal': closeModal(); break;
    case 'modal-submit': if(window.__modalSubmit) window.__modalSubmit(); break;
  }
});
document.addEventListener('click',e=>{ const ov=e.target.closest('.overlay'); if(ov && !e.target.closest('[data-stop]') && !e.target.closest('[data-action]')) closeModal(); });
document.addEventListener('change',e=>{ if(e.target.id==='importFile' && e.target.files[0]) importData(e.target.files[0]); });
document.addEventListener('keydown',e=>{
  if(F.active){ if(e.key==='Escape'){ e.preventDefault(); } return; }
  if(e.target.matches('input,textarea,select')) return;
  if(ui.view==='tasks'){ if(e.key==='ArrowLeft'){ui.curDay=keyOf(addDays(fromKey(ui.curDay),-1));render();} if(e.key==='ArrowRight'){ui.curDay=keyOf(addDays(fromKey(ui.curDay),1));render();} }
});

/* ---------------- habits actions ---------------- */
function toggleHabit(h,k){ if(!h) return; if(!state.habitLog[k]) state.habitLog[k]={}; const cur=state.habitLog[k][h.id]; if(h.type==='count'){ state.habitLog[k][h.id]= habitDone(h,k)?0:(h.target||1); } else { state.habitLog[k][h.id]= cur?0:1; } save(); render(); }
function setHabit(h,k,v){ if(!h) return; if(!state.habitLog[k]) state.habitLog[k]={}; state.habitLog[k][h.id]=v; save(); render(); }

/* ---------------- settings actions ---------------- */
function saveTargets(){ state.settings.targets.gymPerWeek=clampN('tGym',0,14,4); state.settings.targets.studyHrsPerDay=parseFloat(el('tStudy').value)||2; state.settings.targets.dailyTasks=clampN('tTasks',1,30,5); save(); render(); toast('Targets saved'); }
function saveWeights(){ ['tasks','big3','habits','gym','study','focus'].forEach(k=>{ state.settings.weights[k]=clampN('w_'+k,0,50,10); }); save(); render(); toast('Weights saved'); }
function clampN(id,min,max,def){ const v=parseInt(el(id).value,10); return isNaN(v)?def:Math.max(min,Math.min(max,v)); }

/* ---------------- backup ---------------- */
async function exportData(){ const data=JSON.stringify(state,null,2); const fn='momentum-backup-'+todayKey()+'.json';
  if(CAP.downloads){ try{ await CAP.downloads.save({filename:fn, data}); toast('Backup saved'); return; }catch(e){} }
  try{ const blob=new Blob([data],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=fn; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000); toast('Backup downloaded'); }
  catch(e){ openModal(`<h3>Copy your backup</h3><div class="msub">Select all and copy this to a safe place.</div><textarea class="inp" style="min-height:200px" onclick="this.select()">${esc(data)}</textarea><div class="modal-foot"><button class="btn primary" data-action="closemodal">Done</button></div>`); } }
function importData(file){ const rd=new FileReader(); rd.onload=()=>{ try{ const p=JSON.parse(rd.result); if(!p||typeof p!=='object'||!('days' in p)) throw 0; state=mergeState(p); save(); render(); toast('Data restored'); }catch(e){ toast('Could not read that file'); } }; rd.readAsText(file); }

function openModal(html, onSubmit){ closeModal(); const ov=document.createElement('div'); ov.className='overlay'; ov.innerHTML=`<div class="modal" data-stop>${html}</div>`; document.body.appendChild(ov); window.__modalSubmit=onSubmit||null; const fi=ov.querySelector('input,textarea,select'); if(fi) setTimeout(()=>fi.focus(),40); }
function closeModal(){ if(_recOn){ _recOn=false; clearTimeout(_recWatch); try{ _rec&&_rec.stop(); }catch(e){} } document.querySelectorAll('.overlay').forEach(o=>o.remove()); window.__modalSubmit=null; }

      <label class="fld"><span>Est. minutes</span><input class="inp" type="number" id="m_est" min="0" step="5" value="${esc(t&&t.estMin?t.estMin:'')}" placeholder="e.g. 30"></label>
    </div>

    ${t&&!t.done?`<label class="fld"><span>If skipped, why? (helps spot patterns)</span><select class="inp" id="m_reason"><option value="">—</option>${['Forgot','Too difficult','No time','Procrastinated','Distracted','Not important anymore','Other'].map(r=>`<option ${t.missReason===r?'selected':''}>${r}</option>`).join('')}</select></label>`:''}
    <div class="modal-foot"><button class="btn ghost" data-action="closemodal">Cancel</button><button class="btn primary" data-action="modal-submit">${t?'Save':'Add task'}</button></div>`,
    ()=>{ const text=el('m_text').value.trim(); if(!text){ toast('Add some text'); return; }

      if(el('m_reason')) obj.missReason=el('m_reason').value||null;
      if(t){ Object.assign(t,obj); } else { day.tasks.push({id:genId(),done:false,ts:Date.now(),...obj}); }

/* ============================================================
   PLAN — voice / text "brain dump" → tasks, exams, assignments + a day schedule
   Runs 100% locally (no server / AI needed): rule-based natural-language parsing.
   ============================================================ */
const WEEKDAYS=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const MONTHNAMES=['january','february','march','april','may','june','july','august','september','october','november','december'];
const NUMWORDS={one:'1',two:'2',three:'3',four:'4',five:'5',six:'6',seven:'7',eight:'8',nine:'9',ten:'10',eleven:'11',twelve:'12',half:'0.5'};
function normNums(s){ return String(s||'').replace(/\b(one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|half)\b/gi, m=>NUMWORDS[m.toLowerCase()]); }
function fmtClock(min){ min=((Math.round(min)%1440)+1440)%1440; let h=Math.floor(min/60), m=min%60; const ap=h<12?'AM':'PM'; let h12=h%12; if(h12===0)h12=12; return h12+':'+pad(m)+' '+ap; }
function catEmoji(c){ return (CATS[c]&&CATS[c].emoji)||'•'; }

function parseWhen(text, base){
  const s=' '+String(text).toLowerCase()+' ';
  const b=new Date(base); b.setHours(0,0,0,0);
  if(/\bday after tomorrow\b/.test(s)) return keyOf(addDays(b,2));
  if(/\btomorrow\b|\btmrw\b|\btomo\b/.test(s)) return keyOf(addDays(b,1));
  if(/\btoday\b|\btonight\b/.test(s)) return keyOf(b);
  // month name (full or 3-letter)
  let mo=-1; for(let i=0;i<12;i++){ if(new RegExp('\\b'+MONTHNAMES[i].slice(0,3)+'[a-z]*\\b').test(s)) { mo=i; break; } }
  let dm=null;
  let m=s.match(/\b(\d{1,2})\s*(?:st|nd|rd|th)\b/) || s.match(/\bon the (\d{1,2})\b/);
  if(m) dm=parseInt(m[1],10);
  if(dm==null && mo>=0){ const mm=s.match(new RegExp(MONTHNAMES[mo].slice(0,3)+'[a-z]*\\s+(\\d{1,2})')) || s.match(new RegExp('(\\d{1,2})\\s*(?:st|nd|rd|th)?\\s+'+MONTHNAMES[mo].slice(0,3))); if(mm) dm=parseInt(mm[1],10); }
  const dmy=s.match(/\b(\d{1,2})[\/\-](\d{1,2})\b/); if(dmy){ dm=parseInt(dmy[1],10); mo=parseInt(dmy[2],10)-1; }
  if(dm!=null && dm>=1 && dm<=31){
    let mm=(mo>=0?mo:b.getMonth()); let d=new Date(b.getFullYear(),mm,dm); d.setHours(0,0,0,0);
    if(d<b){ d = mo>=0 ? new Date(b.getFullYear()+1,mm,dm) : new Date(b.getFullYear(),mm+1,dm); }
    return keyOf(d);
  }
  for(let i=0;i<7;i++){ if(new RegExp('\\b'+WEEKDAYS[i]+'\\b').test(s)){ let diff=(i-b.getDay()+7)%7; if(diff===0) diff=7; return keyOf(addDays(b,diff)); } }
  return null;
}
function parseDurMin(text){
  const m=String(text).toLowerCase().match(/(\d+(?:\.\d+)?)\s*(hours?|hrs?|h|minutes?|mins?|m)\b/);
  if(!m) return null;
  const n=parseFloat(m[1]); return /^(h|hour|hr)/.test(m[2]) ? Math.round(n*60) : Math.round(n);
}
function _t12(h,mm,ap,ctx){
  h=parseInt(h,10); mm=mm?parseInt(mm,10):0;
  ap=(ap||'').toLowerCase(); if(!ap){ if(/evening|night|pm/.test(ctx)) ap='pm'; else if(/morning|am/.test(ctx)) ap='am'; }
  if(ap==='pm'&&h<12) h+=12; if(ap==='am'&&h===12) h=0;
  if(!ap && h>=1 && h<=7) h+=12; // bare 1–7 → afternoon/evening (typical)
  return h*60+mm;
}
function parseTimes(text){
  const s=String(text).toLowerCase();
  let m=s.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*(?:to|until|till|[-–—])\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/);
  if(m){ let start=_t12(m[1],m[2],m[3]||m[6],s), end=_t12(m[4],m[5],m[6]||m[3],s); if(end<=start) end+=720; return {startMin:start,endMin:end}; }
  m=s.match(/\bat\s+(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/) || s.match(/\b(\d{1,2}):(\d{2})\s*(am|pm)?/);
  if(m){ return {startMin:_t12(m[1],m[2],m[3],s)}; }
  return null;
}
function classifyClause(c){
  c=' '+c.toLowerCase()+' ';
  if(/\bexam\b|\btest\b|\bquiz\b|\bviva\b|\bmid ?term\b|\bfinals?\b|\bpaper\b|\bpractical\b|\bprac\b|\bpresentation\b/.test(c)) return 'exam';
  if(/\bassignment\b|\bhomework\b|\bsubmit\b|\bsubmission\b|\bdue\b|\bdeadline\b|\bhand ?in\b|\bturn ?in\b/.test(c)) return 'assignment';
  if(/\bmeeting\b|\bcall\b|\bappointment\b|\binterview\b/.test(c)) return 'meeting';
  if(/\bgym\b|\bworkout\b|\bwork\s?out\b|\bexercise\b|\bcardio\b|\brun\b|\blift/.test(c)) return 'gym';
  if(/\bstud(y|ies|ying)\b|\brevis\w*\b|\bread(ing)?\b|\blecture\b|\bclass\b|\bnotes\b|\bpractice\b/.test(c)) return 'study';
  if(/\bbusiness\b|\bwork\b|\bproject\b|\bemail\b|\bclient\b|\boffice\b/.test(c)) return 'work';
  return 'general';
}
function cleanTitle(cl){
  let t=' '+cl+' ';
  t=t.replace(/\b(on|by|due|the|this|next|coming|for|at|from|to|of|i|have|has|had|got|gotta|need|needs|want|wanna|plan|planning|planned|going|gonna|go|will|am|is|a|an|my|do|doing)\b/gi,' ');
  MONTHNAMES.forEach(mn=>{ t=t.replace(new RegExp('\\b'+mn.slice(0,3)+'[a-z]*\\b','gi'),' '); });
  WEEKDAYS.forEach(w=>{ t=t.replace(new RegExp('\\b'+w+'\\b','gi'),' '); });
  t=t.replace(/\b(tomorrow|today|tonight|tmrw|tomo|day after tomorrow|day after)\b/gi,' ');
  t=t.replace(/\b\d{1,2}[:.]\d{2}\s*(am|pm)?\b/gi,' ').replace(/\b(am|pm)\b/gi,' ');
  t=t.replace(/\b(\d{1,2})\s*(?:st|nd|rd|th)?\b/gi,' ');
  t=t.replace(/\b(hours?|hrs?|minutes?|mins?)\b/gi,' ');
  t=t.replace(/[^\w &+/-]/g,' ').replace(/\s+/g,' ').trim();
  return t.replace(/^\w/,c=>c.toUpperCase());
}
function niceLabel(cl, kind){
  let t=cleanTitle(cl);
  if(!t) t={gym:'Gym',study:'Study',work:'Work',meeting:'Meeting',general:'Task'}[kind]||'Task';
  return t;
}
function parseBrainDump(text, defDate){
  const items=[];
  const raw=normNums(text);
  const globalDate=parseWhen(raw, new Date());
  const clauses=raw.split(/\n|,|;|\.|\band\b|\balso\b|\bplus\b|\bthen\b|\bafter that\b/i).map(x=>x.trim()).filter(x=>x.replace(/[^a-z0-9]/gi,'').length>1);
  clauses.forEach(cl=>{
    const kind=classifyClause(cl);
    const when=parseWhen(cl, new Date());
    const dur=parseDurMin(cl);
    const times=parseTimes(cl);
    const date=when||globalDate||defDate;
    if(kind==='exam'){ let ti=cleanTitle(cl); if(!/exam|test|quiz|viva|paper|practical|prac|presentation|final|mid ?term/i.test(ti)) ti=ti+' exam'; items.push({kind:'exam', title:ti||'Exam', date}); return; }
    if(kind==='assignment'){ let ti=cleanTitle(cl); if(!/assignment|homework|submission|deadline/i.test(ti)) ti=ti+' assignment'; items.push({kind:'assignment', title:ti||'Assignment', date}); return; }
    const cat = kind==='gym'?'gym' : kind==='study'?'academics' : (kind==='meeting'||kind==='work')?'work' : 'general';
    const item={kind:'task', text:niceLabel(cl,kind), category:cat, date, estMin:dur||null};
    if(times){ item.startMin=times.startMin; if(times.endMin!=null){ item.endMin=times.endMin; if(!item.estMin && times.endMin>times.startMin) item.estMin=times.endMin-times.startMin; } }
    items.push(item);
  });
  return {items, scheduleDate: globalDate||defDate};
}
function applyPlanItems(items){
  let nTasks=0,nExam=0,nAssign=0;
  items.forEach(it=>{
    if(it.kind==='exam'){ state.assignments.push({id:genId(),title:it.title||'Exam',atype:'exam',subjectId:null,deadline:it.date,done:false}); nExam++; }
    else if(it.kind==='assignment'){ state.assignments.push({id:genId(),title:it.title||'Assignment',atype:'assignment',subjectId:null,deadline:it.date,done:false}); nAssign++; }
    else { const d=ensureDay(it.date); const t={id:genId(),text:it.text||'Task',category:it.category||'general',done:false,ts:Date.now()}; if(it.estMin)t.estMin=it.estMin; if(it.startMin!=null)t.startMin=it.startMin; if(it.endMin!=null)t.endMin=it.endMin; d.tasks.push(t); nTasks++; }
  });
  save(); return {nTasks,nExam,nAssign};
}

/* ---- day schedule generator (fits flexible tasks around prayers + fixed events) ---- */
function buildDaySchedule(k){
  const day=getDay(k); const tasks=(day.tasks||[]).filter(t=>!t.done);
  let pinned=[];
  if(isIslam()){ const pt=prayerTimesFor(fromKey(k));
    pinned=PRAYERS.map(([id,label])=>({startMin:Math.round(pt[id]*60), endMin:Math.round(pt[id]*60)+15, label:label, icon:ic('crescent'), type:'prayer'}));
  } else if(!faithHidden()){ const fic=ic(faithCfg().icon);
    pinned=activePractices().filter(p=>/^\d{1,2}:\d{2}$/.test(p.time||'')).map(p=>{ const [h,m]=p.time.split(':').map(Number); const s=h*60+m; return {startMin:s, endMin:s+15, label:p.name, icon:fic, type:'prayer'}; });
  }
  const flex=[];
  tasks.forEach(t=>{
    if(t.startMin!=null){ pinned.push({startMin:t.startMin, endMin:(t.endMin!=null?t.endMin:t.startMin+(t.estMin||60)), label:t.text, icon:catEmoji(t.category), type:'fixed'}); }
    else flex.push({dur:t.estMin||45, label:t.text, icon:catEmoji(t.category), cat:t.category});
  });
  pinned.sort((a,b)=>a.startMin-b.startMin);
  const order={gym:0,academics:1,work:2,general:3};
  flex.sort((a,b)=>(order[a.cat]==null?3:order[a.cat])-(order[b.cat]==null?3:order[b.cat]));
  const out=pinned.slice();
  const dayEnd=Math.min(1439, Math.round(pt.isha*60)+90);
  let cursor=Math.round(pt.fajr*60);
  const nextPinnedAfter=t=>{ let best=null; pinned.forEach(p=>{ if(p.startMin>=t && (!best||p.startMin<best.startMin)) best=p; }); return best; };
  flex.forEach(f=>{
    let placed=false, guard=0;
    while(!placed && cursor<dayEnd && guard++<60){
      const inside=pinned.find(p=>cursor>=p.startMin && cursor<p.endMin);
      if(inside){ cursor=inside.endMin+5; continue; }
      const np=nextPinnedAfter(cursor); const gapEnd=np?np.startMin:dayEnd; const avail=gapEnd-cursor;
      if(avail>=Math.min(f.dur,25)){ const dur=Math.min(f.dur,avail); out.push({startMin:cursor,endMin:cursor+dur,label:f.label,icon:f.icon,type:'task'}); cursor+=dur+10; placed=true; }
      else if(np){ cursor=np.endMin+5; } else break;
    }
    if(!placed) out.push({startMin:null,endMin:null,label:f.label,icon:f.icon,type:'task',unscheduled:true});
  });
  return out.sort((a,b)=>{ if(a.startMin==null) return 1; if(b.startMin==null) return -1; return a.startMin-b.startMin; });
}
function scheduleRows(k){
  const sch=buildDaySchedule(k); if(!sch.length) return '';
  return sch.map(b=>{
    if(b.unscheduled) return `<div class="dl"><span class="dwhen mono" style="min-width:66px;color:var(--muted)">—</span><span class="lp" style="background:var(--muted)"></span><span class="dtx">${b.icon||''} ${esc(b.label)}</span><span class="dwhen">no free slot</span></div>`;

let _rec=null, _recOn=false, _recBase='', _recGotResult=false, _recWatch=null;
/* Device-appropriate built-in dictation instructions (always works, no cloud needed). */
function dictHelp(){ const ua=navigator.userAgent||'';
  if(/Android/i.test(ua)) return 'tap the box above, then the <b>microphone key</b> on your keyboard';
  if(/iPhone|iPad|iPod/i.test(ua)) return 'tap the box above, then the <b>microphone</b> on your keyboard';
  if(/Windows|Win32|Win64/i.test(ua)) return 'click the box above and press <b>Win + H</b>';
  if(/Mac/i.test(ua)) return 'click the box above and press <b>Fn</b> twice (macOS Dictation)';
  return "use your device's built-in voice typing";
}
function micTip(html,warn){ const h=el('micHint'); if(h){ h.innerHTML=''+html; h.style.color=warn===false?'var(--accent)':'var(--warn)'; } }
function setMicBtn(on){ const b=el('planMic'); if(b){ b.innerHTML=on?(ic('stop')+' Stop'):(ic('mic')+' Speak'); b.classList.toggle('primary',on); } }
function toggleVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ micTip('This browser has no built-in voice. Click the box and press <b>Win + H</b> to use Windows voice typing.'); return; }
  if(_recOn){ stopVoice(); micTip('Added. Tap <b>Preview →</b> to sort it into your day.',false); return; }
  const ta=el('planText'); if(!ta) return;
  _recOn=true; _recGotResult=false; _recBase=ta.value.trim(); setMicBtn(true);
  micTip('Listening… speak naturally — short pauses are fine. Tap <b>Stop</b> when done.',false);
  // Watchdog: if the browser's speech service returns nothing, guide to reliable OS dictation.
  clearTimeout(_recWatch); _recWatch=setTimeout(()=>{ if(_recOn && !_recGotResult){ micTip("I don't hear words coming through — this browser's speech service may be blocked here. For reliable dictation, "+dictHelp()+", then tap <b>Preview →</b>. (The typing box still works too.)"); } }, 6500);
  startRec(SR);
}
function stopVoice(){ _recOn=false; clearTimeout(_recWatch); try{ _rec&&_rec.stop(); }catch(e){} setMicBtn(false); }
function startRec(SR){
  try{
    _rec=new SR(); _rec.lang='en-US'; _rec.interimResults=true; _rec.continuous=true; try{_rec.maxAlternatives=1;}catch(e){}
    _rec.onresult=e=>{ const ta=el('planText'); if(!ta) return; _recGotResult=true; clearTimeout(_recWatch); let fin='',intr='';
      for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) fin+=r[0].transcript+' '; else intr+=r[0].transcript+' '; }
      if(fin) _recBase=(_recBase?_recBase+' ':'')+fin.trim();
      ta.value=(_recBase?_recBase+' ':'')+intr.trim();
    };
    _rec.onerror=ev=>{ const err=(ev&&ev.error)||'error';
      if(err==='no-speech'||err==='aborted') return;              // harmless — keep listening (onend restarts)
      if(/not-allowed|service-not-allowed|denied/i.test(err)){ stopVoice(); micTip("The browser blocked the mic. Click the padlock in the address bar → set Microphone to <b>Allow</b>, reload, and try again. Or "+dictHelp()+"."); }
      else if(err==='network'){ clearTimeout(_recWatch); micTip("Can't reach this browser's speech service — retrying. If it keeps failing, "+dictHelp()+" to dictate reliably."); }
      else micTip('Voice: '+err+'. You can '+dictHelp()+', or just type.');
    };
    _rec.onend=()=>{ // Chrome auto-ends on any pause — keep it alive until the user taps Stop
      if(_recOn){ const ta=el('planText'); if(ta) _recBase=ta.value.trim(); try{ _rec.start(); }catch(e){ setTimeout(()=>{ if(_recOn) startRec(SR); },300); } }
      else setMicBtn(false);
    };
    _rec.start();
  }catch(e){ _recOn=false; setMicBtn(false); micTip("Couldn't start the mic. Click the box and press <b>Win + H</b>, or just type."); }
}

function startFocus({min,type,label,taskId,ambient}){

function noiseBuffer(ctx,type){ const len=ctx.sampleRate*2; const buf=ctx.createBuffer(1,len,ctx.sampleRate); const d=buf.getChannelData(0); let last=0; let b=[0,0,0,0,0,0,0];
  for(let i=0;i<len;i++){ const w=Math.random()*2-1;
    if(type==='brown'){ last=(last+0.02*w)/1.02; d[i]=last*3.5; }
    else if(type==='pink'){ b[0]=0.99886*b[0]+w*0.0555179; b[1]=0.99332*b[1]+w*0.0750759; b[2]=0.96900*b[2]+w*0.1538520; b[3]=0.86650*b[3]+w*0.3104856; b[4]=0.55000*b[4]+w*0.5329522; b[5]=-0.7616*b[5]-w*0.0168980; d[i]=(b[0]+b[1]+b[2]+b[3]+b[4]+b[5]+b[6]+w*0.5362)*0.11; b[6]=w*0.115926; }
    else d[i]=w*0.6; }
  return buf; }

function chime(){ try{ if(!F.audioCtx) F.audioCtx=new (window.AudioContext||window.webkitAudioContext)(); const ctx=F.audioCtx, now=ctx.currentTime; [880,1174.7,1567.98].forEach((f,i)=>{ const o=ctx.createOscillator(), g=ctx.createGain(); o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(0,now+i*0.13); g.gain.linearRampToValueAtTime(0.22,now+i*0.13+0.02); g.gain.exponentialRampToValueAtTime(0.001,now+i*0.13+0.5); o.connect(g); g.connect(ctx.destination); o.start(now+i*0.13); o.stop(now+i*0.13+0.55); }); }catch(e){} }

const tip=el('tip');
/* Hover tooltips only on devices that actually hover. On touch phones a tap fires a

const _canHover = !window.matchMedia || window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  document.addEventListener('mousemove',e=>{ if(tip.style.opacity==='1') posTip(e); });
  document.addEventListener('mouseout',e=>{ if(e.target.closest('[data-tip]')) tip.style.opacity='0'; });
}
document.addEventListener('touchstart',()=>{ tip.style.opacity='0'; },{passive:true});
function posTip(e){ const pad=14; let x=e.clientX+pad, y=e.clientY+pad; const r=tip.getBoundingClientRect(); if(x+r.width>innerWidth-8) x=e.clientX-r.width-pad; if(y+r.height>innerHeight-8) y=e.clientY-r.height-pad; tip.style.left=x+'px'; tip.style.top=y+'px'; }
let toastTmr; function toast(msg){ const t=el('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTmr); toastTmr=setTimeout(()=>t.classList.remove('show'),2600); }
function celebrate(){ const cv=el('confetti'), ctx=cv.getContext('2d'); cv.width=innerWidth; cv.height=innerHeight; const colors=['#8b7bf9','#b18cf8','#2fce88','#f5b73d','#3f8ae6','#e0662f']; const parts=[]; for(let i=0;i<150;i++) parts.push({x:innerWidth/2+(Math.random()-.5)*220,y:innerHeight/3,vx:(Math.random()-.5)*12,vy:Math.random()*-13-4,g:.32+Math.random()*.16,s:6+Math.random()*7,c:colors[i%colors.length],rot:Math.random()*6,vr:(Math.random()-.5)*.4}); let f=0; (function loop(){ ctx.clearRect(0,0,cv.width,cv.height); f++; parts.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); ctx.restore(); }); if(f<130) requestAnimationFrame(loop); else ctx.clearRect(0,0,cv.width,cv.height); })(); }

/* request notification permission lazily when toggled */
document.addEventListener('change',e=>{ if(e.target.id==='fNotify'){ state.settings.notify=e.target.checked; if(e.target.checked && 'Notification' in window && Notification.permission!=='granted'){ Notification.requestPermission(); } save(); } if(e.target.id==='fStrict'){ state.settings.focus.strict=e.target.checked; save(); } if(e.target.id==='fDefault'){ state.settings.focus.defaultMin=parseInt(e.target.value)||45; save(); } if(e.target.id==='prayerNotify'){ state.settings.prayerNotify=e.target.checked; if(e.target.checked && 'Notification' in window && Notification.permission!=='granted'){ Notification.requestPermission(); } save(); } });

/* ---------------- prayer reminder ticker (only while app is open) ---------------- */
const _prayerNotified=new Set();
function prayerTick(){
  if(!state.settings.prayerNotify || !isIslam()) return;
  const now=new Date(); const nowH=now.getHours()+now.getMinutes()/60; const t=prayerTimesFor(now); const dk=todayKey();
  PRAYERS.forEach(([id,label])=>{ const key=dk+id; if(_prayerNotified.has(key)) return; if(nowH>=t[id] && nowH-t[id]<=1.2/60){ _prayerNotified.add(key); toast(`${label} — time to pray`); if('Notification' in window && Notification.permission==='granted'){ try{ new Notification(label+' — '+fmtTime(t[id]), {body:'Time for prayer.'}); }catch(e){} } } });
}
setInterval(prayerTick, 30000);

/* ---------------- boot ---------------- */
try{ const s=(state._ui)||JSON.parse(sessionStorage.getItem('mui')||'null'); if(s){ if(s.view && VIEWS[s.view]) ui.view=s.view; if(s.curDay) ui.curDay=s.curDay; } }catch(e){}
render();
initSync();   // load durable state from db, seed it if empty, and subscribe for cross-device sync
// safety net: if db is slow/unavailable, don't leave a brand-new user without onboarding forever
setTimeout(()=>{ if(!dbSettled){ dbSettled=true; render(); } }, 11000);
// flush any pending write the instant we leave (switch tab/app, minimise, close) so nothing debounced is lost
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flushDbNow(); });
window.addEventListener('pagehide', flushDbNow);

</script></body></html>
